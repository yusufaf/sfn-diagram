<svg width="518.6" height="230" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518.6 230" role="graphics-document" aria-label="Task with retry and catch policies"><title>Task with retry and catch policies</title><desc>3 states, 3 transitions.</desc><rect x="0" y="0" width="518.6" height="230" fill="#1e1e1e"></rect><defs><marker id="sfn-d7bde063-arrowhead-normal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#90a4ae"></polygon></marker><marker id="sfn-d7bde063-arrowhead-error" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#ef5350"></polygon></marker><marker id="sfn-d7bde063-arrowhead-choice" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#ce93d8"></polygon></marker><marker id="sfn-d7bde063-arrowhead-default" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#ba68c8"></polygon></marker><marker id="sfn-d7bde063-arrowhead-retry" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#ffca28"></polygon></marker></defs><g class="edges"><path d="M204.231,80L211.859,85.833C219.487,91.667,234.744,103.333,242.372,115C250,126.667,250,138.333,250,144.167L250,150" data-edge-id="Submit-&gt;Done#normal#0" fill="none" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#sfn-d7bde063-arrowhead-normal)"><title>Submit to Done</title></path><path d="M 225,38 C 265,50 265,50 225,62" data-edge-id="Submit-&gt;Submit#retry#0" fill="none" stroke="#ffca28" stroke-width="1.5" marker-end="url(#sfn-d7bde063-arrowhead-retry)" stroke-dasharray="4,3"><title>Submit to Submit: States.Timeout: up to 4 retries, first after 2s, backoff 2x; States.ALL: up to 2 retries, first after 1s, backoff 2x</title></path><rect x="263" y="40" width="235.60000000000005" height="20" fill="#1e1e1e" stroke="#ffca28" stroke-width="0.5" rx=