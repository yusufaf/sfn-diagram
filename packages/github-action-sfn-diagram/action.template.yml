# Source template for the Marketplace action — deliberately NOT named action.yml.
# The action is published from the standalone mirror repo
# (yusufaf/sfn-diagram-action); GitHub can only list an action whose action.yml
# is at a repo root, so the monorepo cannot publish this subdirectory copy. Worse,
# a real action.yml here makes GitHub treat the monorepo as the canonical action
# and suppress the mirror. Keeping this as *.template.yml means GitHub never
# detects the monorepo as an action; scripts/sync-action-mirror.sh renders this
# file to the mirror's root action.yml on release.
name: 'Step Functions Diagram Preview'
description: 'Preview and diff AWS Step Functions ASL diagrams on pull requests'
author: 'sfn-diagram'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}
  asl-glob:
    description: 'Comma-separated glob patterns to match ASL definition files'
    required: false
    default: '**/*.asl.json,**/*.asl'
  comment-tag:
    description: 'Unique tag used to find and update an existing PR comment'
    required: false
    default: 'sfn-diagram-preview'
  hide-catch:
    description: >-
      Drop error-handler (Catch) branches from the rendered diagrams — useful for
      shrinking a large diagram. Applies to new/deleted-file diagrams only; a
      modified file's diff diagram is unaffected. Set to 'true' to enable.
    required: false
    default: 'false'
  theme:
    description: >-
      Colour theme driving the Mermaid classDef styling: 'light' (default) or 'dark'.
    required: false
    default: 'light'
  layout:
    description: >-
      Graph layout direction emitted as the Mermaid direction statement:
      'TB' (default), 'LR', 'RL', or 'BT'.
    required: false
    default: 'TB'
  collapse:
    description: >-
      Collapse Parallel/Map containers into a single placeholder node. 'true'
      collapses every container; a comma-separated list of state names collapses
      only those; empty (default) collapses nothing. Applies to new/deleted-file
      diagrams only.
    required: false
    default: ''
  execution-mode:
    description: >-
      Optionally overlay a real execution onto the changed diagram.
      'off' (default) makes no AWS calls; 'latest' overlays the most recent
      execution; 'latest-failed' overlays the most recent failed execution.
      Requires state-machine-arn and AWS credentials (e.g. via
      aws-actions/configure-aws-credentials), plus IAM permissions
      states:ListExecutions and states:GetExecutionHistory. Only applied when
      exactly one ASL file changed in the PR.
    required: false
    default: 'off'
  state-machine-arn:
    description: 'ARN of the state machine to fetch executions for (required when execution-mode is not off)'
    required: false
    default: ''
  aws-region:
    description: 'AWS region for the Step Functions client (defaults to the SDK/environment resolution, e.g. AWS_REGION)'
    required: false
    default: ''

outputs:
  changed-count:
    description: 'Number of changed ASL files matched by asl-glob (0 when none, or when the event is not a pull request)'
  changed-files:
    description: 'JSON array of the changed ASL file paths (added, modified, or removed); "[]" when none'
  comment-id:
    description: 'ID of the PR comment created or updated by this run; empty when no comment was posted'
  comment-url:
    description: 'HTML URL of the PR comment created or updated by this run; empty when no comment was posted'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'git-merge'
  color: 'orange'
