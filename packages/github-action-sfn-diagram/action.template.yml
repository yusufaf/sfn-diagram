# Source template for the Marketplace action — deliberately NOT named action.yml.
# The action is published from the standalone mirror repo
# (yusufaf/sfn-diagram-action); GitHub can only list an action whose action.yml
# is at a repo root, so the monorepo cannot publish this subdirectory copy. Worse,
# a real action.yml here makes GitHub treat the monorepo as the canonical action
# and suppress the mirror. Keeping this as *.template.yml means GitHub never
# detects the monorepo as an action; scripts/sync-action-mirror.sh renders this
# file to the mirror's root action.yml on release.
name: 'Step Functions Diagram Preview'
description: 'Preview and diff AWS Step Functions ASL diagrams on pull requests'
author: 'sfn-diagram'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}
  asl-glob:
    description: 'Comma-separated glob patterns to match ASL definition files'
    required: false
    default: '**/*.asl.json,**/*.asl'
  comment-tag:
    description: 'Unique tag used to find and update an existing PR comment'
    required: false
    default: 'sfn-diagram-preview'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'git-merge'
  color: 'orange'
