# NOTE: This name intentionally differs from the published Marketplace name.
# The action is published from the standalone mirror repo
# (yusufaf/sfn-diagram-action), whose root action.yml owns the public name
# "Step Functions Diagram Preview". Two repos cannot share a Marketplace action
# name, so this source copy uses a distinct name to avoid a collision that would
# block the mirror from being listed; scripts/sync-action-mirror.sh rewrites it
# to the canonical public name when generating the mirror.
name: 'Step Functions Diagram Preview (source)'
description: 'Preview and diff AWS Step Functions ASL diagrams on pull requests'
author: 'sfn-diagram'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}
  asl-glob:
    description: 'Comma-separated glob patterns to match ASL definition files'
    required: false
    default: '**/*.asl.json,**/*.asl'
  comment-tag:
    description: 'Unique tag used to find and update an existing PR comment'
    required: false
    default: 'sfn-diagram-preview'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'git-merge'
  color: 'orange'
