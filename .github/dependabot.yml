# Every dependency PR touches the root pnpm-lock.yaml, so release-please
# attributes it to the core `sfn-diagram` package. The commit prefixes below
# are deliberately chore/ci/build — never fix/feat — so bot PRs cannot bump a
# version or write a changelog entry on their own. Retitle a PR to `fix(deps)`
# by hand when a shipped dependency should trigger a patch release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    ignore:
      # TypeScript 7's npm package has no classic compiler API (it exports only
      # ./unstable/*), and typescript-eslint and @astrojs/check don't accept it.
      # Drop this once those tools support 7.
      - dependency-name: typescript
        versions:
          - ">=7.0.0"
      # @types/vscode must not exceed the extension's engines.vscode floor:
      # vsce refuses to package when it does, and even a patch update rewrites
      # the specifier past the floor. Bump both by hand, in one commit.
      - dependency-name: "@types/vscode"
    # A dependency joins the first group it matches, so the version-locked
    # families come first. They set no update-types, so a major moves the
    # whole family in one PR instead of arriving half-bumped.
    groups:
      # react-dom reads React internals; mixing majors breaks at runtime.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # @vitest/coverage-v8 peers an exact vitest version.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      # @eslint/js majors track eslint's.
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
      # The commitlint packages release in lockstep.
      commitlint:
        patterns:
          - "@commitlint/*"
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
      - docker
    # Which Node line the image tracks is an LTS decision, not a version bump:
    # odd majors are never LTS and Node 25+ dropped corepack from the image.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
