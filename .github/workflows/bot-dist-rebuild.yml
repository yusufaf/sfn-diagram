name: Bot Dist Rebuild

# packages/github-action-sfn-diagram ships a committed dist bundle, and Unit
# Test fails when it is stale. Dependabot and the Audit Fix workflow cannot run
# the build themselves, so this rebuilds the bundle on their PRs and pushes the
# result back to the PR branch when it changed. The push is made with the
# release App token so it retriggers CI. That push re-triggers this workflow too
# (the App is also the actor that opens the audit-fix PR, so the actor alone
# cannot tell the two apart); the guard step below skips the rebuild when a bot
# other than Dependabot is the actor and the head commit is already one of ours.
#
# Dependabot-triggered `pull_request` runs only see Dependabot secrets, so
# RELEASE_APP_KEY must also be stored under Settings > Secrets > Dependabot.
#
# The work is split across two jobs on purpose. `build` checks out the pull
# request and runs its dependencies, so it is given no secrets; `push` holds the
# App token, which can write to this repository, and never has the pull request
# on disk at all — it commits the artifact through the contents API. A dependency
# bump is a change to what `pnpm install` and the build execute, and Dependabot
# PRs are same-repo, so without the split a malicious package would run next to a
# repo-push credential. The build also installs with
# `--ignore-scripts`: the bundle is byte-identical without lifecycle scripts
# (esbuild resolves its binary through its @esbuild/* platform package), so
# skipping them costs nothing and closes the postinstall path outright.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REBUILD_SUBJECT: 'chore(action): rebuild dist bundle for dependency update'

jobs:
  build:
    name: Rebuild GitHub Action bundle
    if: github.actor == 'dependabot[bot]' || github.head_ref == 'deps/audit-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      # Only our own push counts: a human who rebases the branch with the
      # rebuild commit still at head needs a fresh build, not a skip. Every
      # actor that reaches this job is dependabot[bot], the release App (which
      # pushes the rebuild and also opens the audit-fix PR), or a human on
      # deps/audit-fix — so "a bot that is not Dependabot" identifies our own
      # push without a token to resolve the App's slug from.
      - name: Skip if this run was triggered by our own rebuild push
        id: guard
        if: github.actor != 'dependabot[bot]' && endsWith(github.actor, '[bot]')
        run: |
          if [ "$(git log -1 --format=%s)" = "$REBUILD_SUBJECT" ]; then
            echo "Head commit is a bundle rebuild; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build bundle
        if: steps.guard.outputs.skip != 'true'
        run: pnpm build:action-bundle

      - name: Hand the bundle to the push job
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: action-dist
          path: packages/github-action-sfn-diagram/dist
          include-hidden-files: true
          if-no-files-found: error

  # Holds the App token, and never has the pull request on disk at all: it takes
  # the rebuilt bundle from the artifact and commits it through the contents
  # API. Committing with git would mean checking the PR branch out next to the
  # credential, which is the shape CodeQL's actions/untrusted-checkout reports
  # and the reason this workflow was flagged. The artifact bytes are still built
  # from PR code, but they only ever land on the PR branch, whose author already
  # controls it.
  push:
    name: Push the rebuilt bundle
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Download the rebuilt bundle
        uses: actions/download-artifact@v8
        with:
          name: action-dist
          path: bundle

      # The contents API writes one file per call, which is all the bundle is.
      # If esbuild ever emits a second file (a sourcemap, a chunk) this fails
      # loudly instead of committing half a bundle.
      - name: Commit the bundle if it changed
        env:
          BUNDLE_PATH: packages/github-action-sfn-diagram/dist/index.js
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          files="$(find bundle -type f | sort)"
          if [ "$files" != "bundle/index.js" ]; then
            echo "::error::expected bundle/index.js alone, got: ${files//$'\n'/ }"
            exit 1
          fi

          # git's own blob id for the rebuilt file, so "did it change?" is the
          # same question the old `git diff` asked, without a working tree.
          size="$(wc -c < bundle/index.js)"
          rebuilt="$( { printf 'blob %d\0' "$size"; cat bundle/index.js; } | sha1sum | cut -d' ' -f1)"
          committed="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${BUNDLE_PATH}?ref=${HEAD_REF}" --jq .sha)"

          if [ "$rebuilt" = "$committed" ]; then
            echo "Bundle is up to date."
            exit 0
          fi

          # The base64 bundle is ~3.8 MB, well past ARG_MAX, so the request body
          # goes to gh on stdin rather than as arguments.
          base64 -w0 bundle/index.js > content.b64
          jq -n \
            --arg branch "$HEAD_REF" \
            --arg email "${SLUG}[bot]@users.noreply.github.com" \
            --arg message "$REBUILD_SUBJECT" \
            --arg name "${SLUG}[bot]" \
            --arg sha "$committed" \
            --rawfile content content.b64 \
            '{branch: $branch, committer: {email: $email, name: $name},
              content: ($content | rtrimstr("\n")), message: $message, sha: $sha}' > body.json

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${BUNDLE_PATH}" \
            --input body.json \
            --jq '"Pushed " + .commit.sha'
