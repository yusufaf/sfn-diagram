name: Bot Dist Rebuild

# packages/github-action-sfn-diagram ships a committed dist bundle, and Unit
# Test fails when it is stale. Dependabot and the Audit Fix workflow cannot run
# the build themselves, so this rebuilds the bundle on their PRs and pushes the
# result back to the PR branch when it changed. The push is made with the
# release App token so it retriggers CI.
#
# That push re-triggers this workflow, which is how it heals: the retriggered run
# rebuilds, finds the committed bundle already current, and stops without a push.
# Nothing skips on the commit subject — an earlier version did, and a rebuild
# that landed on a tree that had moved underneath it would then latch, because
# the stale commit carries the subject the skip matched on and no later run would
# look again. The cost of healing instead of latching is one extra build run per
# rebuild push, which is cheap next to a PR stuck red until a human rebuilds.
#
# Dependabot-triggered `pull_request` runs only see Dependabot secrets, so
# RELEASE_APP_KEY must also be stored under Settings > Secrets > Dependabot.
#
# The work is split across two jobs on purpose. `build` checks out the pull
# request and runs its dependencies, so it is given no secrets; `push` holds the
# App token, which can write to this repository, and never has the pull request
# on disk at all — it commits the artifact through the contents API. A dependency
# bump is a change to what `pnpm install` and the build execute, and Dependabot
# PRs are same-repo, so without the split a malicious package would run next to a
# repo-push credential.

on:
  pull_request:
    branches: [main]

# A newer push to the branch makes an in-flight rebuild obsolete: it would commit
# a bundle built from the superseded tree. Cancel rather than race.
concurrency:
  group: bot-dist-rebuild-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNDLE_PATH: packages/github-action-sfn-diagram/dist/index.js
  REBUILD_SUBJECT: 'chore(action): rebuild dist bundle for dependency update'

jobs:
  build:
    name: Rebuild GitHub Action bundle
    if: github.actor == 'dependabot[bot]' || github.head_ref == 'deps/audit-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      blob: ${{ steps.compare.outputs.blob }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      # Pinned to the event's head SHA, not the branch name, so this builds
      # exactly the tree the run is about even if the branch moves underneath it.
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # `--ignore-scripts` keeps a dependency's lifecycle scripts from running in
      # a job that is about to hand its output to a credentialed one. Measured
      # byte-identical: the build calls esbuild's JS API, and esbuild resolves its
      # binary through its @esbuild/* platform package rather than its postinstall.
      #
      # That byte-identity is load-bearing, not incidental. unit-test.yml rebuilds
      # the same bundle with a plain `pnpm install` and fails on any difference, so
      # a future dependency whose lifecycle script changes the bundle would make
      # this job push something that gate immediately calls stale. The retrigger
      # would rebuild it the same way and stop, leaving the PR red for a human —
      # loud, which is the point, but if it ever happens the two installs need to
      # agree rather than this flag being dropped.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build bundle
        run: pnpm build:action-bundle

      # Decided here rather than in `push` so an unchanged bundle never mints the
      # repo-push token at all. This is also the loop break: the run triggered by
      # our own push lands here with nothing to do. `blob` is the id of the blob
      # the push replaces; reading it from the checkout saves an API round trip.
      - name: Compare against the committed bundle
        id: compare
        run: |
          set -euo pipefail

          # The contents API writes one file per call, which is all the bundle
          # is. If the build ever emits a second file (a sourcemap, a chunk),
          # fail here — before a token exists — rather than commit half of it.
          # Checked before `git diff`, which would not notice an untracked one.
          tracked="$(git ls-files -- packages/github-action-sfn-diagram/dist)"
          built="$(cd packages/github-action-sfn-diagram/dist && find . -type f | sed 's|^\./||' | sort)"
          if [ "$tracked" != "$BUNDLE_PATH" ] || [ "$built" != "index.js" ]; then
            echo "::error::expected index.js alone; tracked=[$tracked] built=[$built]"
            exit 1
          fi

          if git diff --quiet -- packages/github-action-sfn-diagram/dist; then
            echo "Bundle is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "blob=$(git rev-parse "HEAD:$BUNDLE_PATH")" >> "$GITHUB_OUTPUT"

      - name: Hand the bundle to the push job
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: action-dist
          path: packages/github-action-sfn-diagram/dist
          if-no-files-found: error

  # Holds the App token, and never has the pull request on disk at all: it takes
  # the rebuilt bundle from the artifact and commits it through the contents
  # API. Committing with git would mean checking the PR branch out next to the
  # credential, which is the shape CodeQL's actions/untrusted-checkout reports
  # and the reason this workflow was flagged. The artifact bytes are still built
  # from PR code, but they only ever land on the PR branch, whose author already
  # controls it.
  #
  # `build` runs that PR code, so its outputs are not trusted either. Neither one
  # can redirect this job: the path and branch come from the workflow and the
  # event, and a wrong `blob` only makes the request fail.
  push:
    name: Push the rebuilt bundle
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - name: Download the rebuilt bundle
        uses: actions/download-artifact@v8
        with:
          name: action-dist
          path: bundle

      - name: Commit the rebuilt bundle
        env:
          BLOB: ${{ needs.build.outputs.blob }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: no-such-branch-probe-404
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          # The bundle was built from HEAD_SHA. Committing it onto a branch that
          # has since moved would fast-forward cleanly and leave a bundle that
          # does not match its source. The newer push has a run of its own, and a
          # merged or deleted branch has no one left to serve, so stand down for
          # either rather than failing a check on a PR that is already done.
          if ! tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" --jq .object.sha 2>api-error.txt)"; then
            if grep -q '404' api-error.txt; then
              echo "::notice::$HEAD_REF no longer exists; nothing to push to."
              exit 0
            fi
            cat api-error.txt >&2
            exit 1
          fi

          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::$HEAD_REF moved from $HEAD_SHA to $tip; leaving it to that run."
            exit 0
          fi

          # The base64 bundle is ~3.8 MB, well past ARG_MAX, so the request body
          # goes to gh on stdin rather than as arguments.
          base64 -w0 bundle/index.js > content.b64
          jq -n \
            --arg branch "$HEAD_REF" \
            --arg email "${SLUG}[bot]@users.noreply.github.com" \
            --arg message "$REBUILD_SUBJECT" \
            --arg name "${SLUG}[bot]" \
            --arg sha "$BLOB" \
            --rawfile content content.b64 \
            '{branch: $branch, committer: {email: $email, name: $name},
              content: ($content | rtrimstr("\n")), message: $message, sha: $sha}' > body.json

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${BUNDLE_PATH}" \
            --input body.json \
            --jq '"Pushed " + .commit.sha'
