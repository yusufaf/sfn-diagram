name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. sfn-diagram-v0.5.0)'
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # Only build for sfn-diagram releases (legacy v* or sfn-diagram-v* tags),
    # never for github-action-sfn-diagram-v* releases of the other package.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'sfn-diagram-v') || (startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'github-action'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from tag input
        id: version
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#sfn-diagram-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yusufaf/sfn-diagram
          tags: |
            # release-please tags: sfn-diagram-v0.5.0 → 0.5.0 (anchored so it
            # doesn't also match github-action-sfn-diagram-v* release tags)
            type=match,pattern=^sfn-diagram-v(\d+\.\d+\.\d+)$,group=1
            # legacy tags: v0.4.1 → 0.4.1
            type=match,pattern=^v(\d+\.\d+\.\d+)$,group=1
            # manual dispatch: use stripped version from input
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A successful push only means the registry accepted the layers - it does
      # not mean the image runs. Pull it back from ghcr.io (not the local build
      # cache) and actually run it, the way `docker.yml` silently failing to
      # build at all went unnoticed for three releases (v1.4.0 - v1.5.0).
      - name: Verify the published image
        run: |
          IMAGE="ghcr.io/yusufaf/sfn-diagram:${{ steps.meta.outputs.version }}"
          docker pull "$IMAGE"

          ACTUAL_VERSION="$(docker run --rm "$IMAGE" --version)"
          if [ "$ACTUAL_VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::Published image reports version '$ACTUAL_VERSION', expected '${{ steps.meta.outputs.version }}'"
            exit 1
          fi

          docker run --rm -i "$IMAGE" - --format svg \
            < tests/fixtures/simple.asl.json | grep -q '<svg' || {
            echo "::error::Published image did not render a valid SVG from stdin"
            exit 1
          }

  # `docker` failing (or its verification step catching a broken image) has no
  # human "actor" to notify - it's triggered by a release event, not a click.
  # File an issue so a broken image can't silently sit unnoticed the way it did
  # for three releases in a row.
  report-failure:
    name: Report Docker publish failure
    needs: docker
    if: always() && needs.docker.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Docker publish failed for ${{ github.event.release.tag_name || inputs.tag }}" \
            --label bug \
            --body "The \`docker\` job (build, push, or the post-push verification) failed for \`${{ github.event.release.tag_name || inputs.tag }}\`.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
