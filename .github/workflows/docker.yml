name: Docker

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. sfn-diagram-v0.5.0)'
        required: true
      dockerhub_only:
        description: 'Skip the build; only copy the existing ghcr.io image to Docker Hub'
        type: boolean
        default: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # Only build for sfn-diagram releases (legacy v* or sfn-diagram-v* tags),
    # never for another release-please component's tag (github-action-sfn-diagram-v*,
    # sfn-diagram-react-v*, vscode-sfn-diagram-v*) - every one of those contains a
    # hyphen before its own `-v`, which the legacy `v*` tags never do. See #127,
    # where vscode-sfn-diagram-v0.1.1 slipped past a startsWith(tag, 'v') check that
    # only excluded 'github-action'.
    #
    # `dockerhub_only` skips straight to the `dockerhub` job, so re-running a failed
    # Docker Hub copy doesn't rebuild and re-push a new digest over the ghcr.io
    # version tag. `inputs` is empty on a release event, so this half is a no-op there.
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'sfn-diagram-v') || (startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-'))) && !inputs.dockerhub_only
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Resolves the exact version plus its major and major.minor prefixes from
      # the tag, for both trigger types — so `docker/metadata-action` below can
      # emit all four tags the docs promise (latest, <major>, <major>.<minor>,
      # <major>.<minor>.<patch>), not just the exact version and `latest`. Delegates
      # to scripts/resolve-docker-tag.mjs (unit tested in tests/ci/resolveDockerTag.test.ts)
      # which rejects anything but a core sfn-diagram tag outright, so a tag that
      # slips past the job-level `if:` above (or a bad workflow_dispatch input) fails
      # here instead of building and pushing an image under a mangled tag - see #127.
      - name: Resolve version and derived tags
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          node scripts/resolve-docker-tag.mjs --tag "$TAG"

      # QEMU for the linux/arm64 leg, buildx because the default docker driver
      # cannot emit a multi-platform image or use the GitHub Actions cache.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/yusufaf/sfn-diagram
          tags: |
            # Exact version first (docker/metadata-action's `version` output —
            # used below to verify the published image — resolves to the
            # first-listed tag among equal-priority `type=raw` entries).
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest

      # arm64 is built here and nowhere else: unit-test.yml's docker-build-check
      # *runs* the image it builds, and a multi-platform build cannot be loaded into
      # the runner's daemon at all. arm64 under QEMU costs several minutes, which is
      # worth paying a few times a year rather than on every PR - the price is that
      # a cross-arch build break surfaces at release time, which is what the
      # manifest assertion and the report-failure job below exist to make loud.
      #
      # provenance/sbom describe a published artifact, so they belong on this push
      # and would attest nothing in the PR check.
      #
      # No layer cache here, deliberately, though docker-build-check uses one. Two
      # reasons, both about publishing rather than speed: a restored layer would pin
      # `apt-get install ca-certificates ...` to whenever that layer was first built,
      # so a release could ship base packages months stale; and this workflow runs on
      # a tag ref, whose cache scope is not the one the PR check writes, so the
      # restore would likely miss while still exporting multi-GB against the repo's
      # 10 GB quota - which ~14 other jobs share for their pnpm caches. A few
      # uncached minutes a handful of times a year is the cheaper side of that trade.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      # A multi-platform build that silently produced one platform is the shape of
      # failure that shipped a broken image for three releases (#153, v1.4.0-v1.5.0):
      # the build log looks right and nothing checks the result. Read the platforms
      # back out of the pushed manifest instead of trusting the build.
      - name: Verify the published manifest lists both platforms
        run: |
          IMAGE="ghcr.io/yusufaf/sfn-diagram:${{ steps.meta.outputs.version }}"
          PLATFORMS="$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')"
          echo "manifest platforms: $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            case " $PLATFORMS " in
              *" $want "*) ;;
              *)
                echo "::error::published manifest is missing $want (got: $PLATFORMS)"
                exit 1
                ;;
            esac
          done

      # A successful push only means the registry accepted the layers - it does
      # not mean the image runs. Pull it back from ghcr.io (not the local build
      # cache) and actually run it, the way `docker.yml` silently failing to
      # build at all went unnoticed for three releases (v1.4.0 - v1.5.0).
      #
      # Same script unit-test.yml runs against the image built on a PR, so the
      # published-image check and the PR check cannot drift apart (#230). The
      # version assertion is the one part only this job wants: the PR image has no
      # published version to match.
      - name: Verify the published image
        run: |
          IMAGE="ghcr.io/yusufaf/sfn-diagram:${{ steps.meta.outputs.version }}"
          docker pull "$IMAGE"
          bash scripts/docker-smoke.sh \
            --image "$IMAGE" \
            --png-out /tmp/published.png \
            --expect-version "${{ steps.meta.outputs.version }}"

      # The byte checks prove a PNG came out, not that it has anything in it.
      # This job runs unattended, post-publish, with nobody watching it - keep
      # the render downloadable so a human can eyeball text rendering.
      - name: Upload the published image's PNG smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-published-png-smoke
          path: /tmp/published.png
          if-no-files-found: warn

  # A copy of the image `docker` just pushed and verified, not a second build:
  # `imagetools create` from a single source re-tags the existing index as-is, so
  # the Docker Hub image has the same digest as ghcr.io - and since BuildKit stores
  # the provenance and SBOM as attestation manifests *inside* that index, they come
  # along with it. A separate job rather than a second `images:` entry on the build
  # above, so an expired token or a Docker Hub outage can't fail or half-finish the
  # ghcr.io publish. ghcr.io stays the registry the docs point at: Docker Hub
  # rate-limits anonymous pulls, which shared CI runners hit.
  #
  # A personal Docker Hub namespace can't use OIDC (Docker only offers it to paid or
  # DSOS organizations), hence the token. It expires; when it does, this job fails
  # and report-failure below files the issue.
  dockerhub:
    runs-on: ubuntu-latest
    needs: docker
    # No tag guard of its own: on a release event this only runs once `docker` (which
    # has the guard) succeeded, and on a dispatch resolve-docker-tag.mjs rejects
    # anything but a core tag.
    if: ${{ !cancelled() && (needs.docker.result == 'success' || (needs.docker.result == 'skipped' && inputs.dockerhub_only)) }}
    permissions:
      contents: read

    steps:
      # The tag, not main, so docker-smoke.sh and the font probes it reads match the
      # image being checked.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Through env rather than `${{ }}` spliced into the script, so a dispatch
      # input can't inject shell. `inputs.tag` is empty on a release event.
      - name: Resolve version and derived tags
        id: version
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/resolve-docker-tag.mjs --tag "$TAG"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the ghcr.io image to Docker Hub
        run: |
          SRC="ghcr.io/yusufaf/sfn-diagram:${{ steps.version.outputs.version }}"
          DEST="docker.io/azulaf/sfn-diagram"
          docker buildx imagetools create \
            --tag "$DEST:${{ steps.version.outputs.version }}" \
            --tag "$DEST:${{ steps.version.outputs.major }}" \
            --tag "$DEST:${{ steps.version.outputs.minor }}" \
            --tag "$DEST:latest" \
            "$SRC"

      # The whole claim this job rests on. A matching index digest means every
      # platform manifest and both attestation manifests are byte-identical to what
      # `docker` verified; a buildx that ever rewrote the index on copy fails here
      # instead of publishing a silently different image.
      - name: Verify the Docker Hub digest matches ghcr.io
        env:
          GHCR_REF: ghcr.io/yusufaf/sfn-diagram:${{ steps.version.outputs.version }}
          HUB_REF: docker.io/azulaf/sfn-diagram:${{ steps.version.outputs.version }}
        run: |
          # The default `run:` shell has no pipefail, so a failed inspect would only
          # surface later as a confusing "digest '' does not match". Stop on the
          # registry's own error instead.
          set -euo pipefail
          GHCR_DIGEST="$(docker buildx imagetools inspect "$GHCR_REF" --format '{{json .Manifest}}' | jq -r .digest)"
          HUB_DIGEST="$(docker buildx imagetools inspect "$HUB_REF" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "ghcr.io:    $GHCR_DIGEST"
          echo "Docker Hub: $HUB_DIGEST"
          # The real guard: two empty strings, or two `null`s from a field jq can't
          # find, would compare equal. Validating one side is enough - the other has
          # to match it exactly.
          if [[ ! "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read the ghcr.io index digest (got '$GHCR_DIGEST')"
            exit 1
          fi
          if [ "$GHCR_DIGEST" != "$HUB_DIGEST" ]; then
            echo "::error::Docker Hub index digest $HUB_DIGEST does not match ghcr.io's $GHCR_DIGEST"
            exit 1
          fi

      # Logged out first: a repo accidentally left private would still pass a
      # logged-in pull, while every user pulls it anonymously. The digest check above
      # already proves the bytes; this proves Docker Hub serves them.
      - name: Verify an anonymous pull from Docker Hub
        run: |
          docker logout
          bash scripts/docker-smoke.sh \
            --image "docker.io/azulaf/sfn-diagram:${{ steps.version.outputs.version }}" \
            --png-out /tmp/dockerhub.png \
            --expect-version "${{ steps.version.outputs.version }}"

  # `docker` or `dockerhub` failing (or a verification step catching a broken image)
  # has no human "actor" to notify - it's triggered by a release event, not a click.
  # File an issue so a broken image can't silently sit unnoticed the way it did
  # for three releases in a row.
  report-failure:
    name: Report Docker publish failure
    needs: [docker, dockerhub]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Docker publish failed for ${{ github.event.release.tag_name || inputs.tag }}" \
            --label bug \
            --body "A Docker publish job failed for \`${{ github.event.release.tag_name || inputs.tag }}\` (docker: ${{ needs.docker.result }}, dockerhub: ${{ needs.dockerhub.result }}). \`docker\` builds, pushes and verifies the ghcr.io image; \`dockerhub\` copies it to Docker Hub - if only that one failed, check whether the \`DOCKERHUB_TOKEN\` secret expired, then re-run with \`dockerhub_only\` set.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
