name: Docker

permissions:
  contents: read

# Both registries' image names, in one place. DOCKERHUB_USER logs in to push to
# DOCKERHUB_IMAGE, so it has to be that image's namespace.
env:
  GHCR_IMAGE: ghcr.io/yusufaf/sfn-diagram
  DOCKERHUB_IMAGE: docker.io/azulaf/sfn-diagram
  DOCKERHUB_USER: azulaf
  # One tracking issue for every failed scan, across tags and weeks: report-failure
  # files or comments on it, and the scan job closes it on the next green scan.
  SCAN_ISSUE_TITLE: Docker image scan is failing

# One publish at a time, queued rather than cancelled. Each run reads the floating
# tags' current targets and then moves them; two overlapping runs (a release landing
# during a dispatch) could interleave between the read and the push and leave
# `latest` on the older release - on ghcr.io and Docker Hub alike.
#
# `queue: max` because the default (`single`) cancels a pending run when another
# one queues: a weekly or dispatch run - or a sibling component's release run, which
# shares this group even though its jobs skip - could cancel a pending core release
# run. actionlint 1.7.12 flags `queue` as an unknown key (rhysd/actionlint#657);
# GitHub accepts it.
concurrency:
  group: docker-publish
  cancel-in-progress: false
  queue: max

on:
  release:
    types: [published]
  # Rebuilds the newest core release every week, so base-image and Debian security
  # fixes reach the image without waiting for a release. Its tags move to a new
  # digest each time; pin `@sha256:` to freeze an image.
  schedule:
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Core tag to build (e.g. sfn-diagram-v1.9.1); empty builds the newest core release, as the weekly run does. Required with dockerhub_only'
        required: false
      dockerhub_only:
        description: 'Skip the build; only copy the existing ghcr.io image to Docker Hub'
        type: boolean
        default: false

jobs:
  docker:
    runs-on: ubuntu-latest
    # Only build for sfn-diagram releases (legacy v* or sfn-diagram-v* tags),
    # never for another release-please component's tag (github-action-sfn-diagram-v*,
    # sfn-diagram-react-v*, vscode-sfn-diagram-v*) - every one of those contains a
    # hyphen before its own `-v`, which the legacy `v*` tags never do. See #127,
    # where vscode-sfn-diagram-v0.1.1 slipped past a startsWith(tag, 'v') check that
    # only excluded 'github-action'.
    #
    # `dockerhub_only` skips straight to the `dockerhub` job, so re-running a failed
    # Docker Hub copy doesn't rebuild and re-push a new digest over the ghcr.io
    # version tag. `inputs` is empty on a release event, so this half is a no-op there.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'sfn-diagram-v') || (startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-'))) && !inputs.dockerhub_only
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      # Resolved inside the run, after the concurrency lock, so a weekly run queued
      # behind a release builds that release instead of dragging `latest` back: this
      # job moves the floating tags unconditionally. The highest semver core tag, not
      # `releases/latest`, which can point at another component's release. The
      # `|| true` lets an empty result reach the error below instead of pipefail
      # stopping the step first.
      - name: Pick the tag to build
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
              --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
              | { grep -E '^sfn-diagram-v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)"
          fi
          [ -n "$TAG" ] || { echo "::error::found no core release to build"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # Resolves the exact version plus its major and major.minor prefixes from
      # the tag, for both trigger types — so `docker/metadata-action` below can
      # emit all four tags the docs promise (latest, <major>, <major>.<minor>,
      # <major>.<minor>.<patch>), not just the exact version and `latest`. Delegates
      # to scripts/resolve-docker-tag.mjs (unit tested in tests/ci/resolveDockerTag.test.ts)
      # which rejects anything but a core sfn-diagram tag outright, so a tag that
      # slips past the job-level `if:` above (or a bad workflow_dispatch input) fails
      # here instead of building and pushing an image under a mangled tag - see #127.
      #
      # The tag goes through env rather than `${{ }}` spliced into the script, so a
      # dispatch input can't inject shell. `inputs.tag` is empty on a release event.
      - name: Resolve version and derived tags
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: node scripts/resolve-docker-tag.mjs --tag "$TAG"

      # QEMU for the linux/arm64 leg, buildx because the default docker driver
      # cannot emit a multi-platform image or use the GitHub Actions cache.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            # Exact version first (docker/metadata-action's `version` output —
            # used below to verify the published image — resolves to the
            # first-listed tag among equal-priority `type=raw` entries).
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest

      # arm64 is built here and nowhere else: unit-test.yml's docker-build-check
      # *runs* the image it builds, and a multi-platform build cannot be loaded into
      # the runner's daemon at all. arm64 under QEMU costs several minutes, which is
      # worth paying a few times a year rather than on every PR - the price is that
      # a cross-arch build break surfaces at release time, which is what the
      # manifest assertion and the report-failure job below exist to make loud.
      #
      # provenance/sbom describe a published artifact, so they belong on this push
      # and would attest nothing in the PR check.
      #
      # No layer cache here, deliberately, though docker-build-check uses one. Two
      # reasons, both about publishing rather than speed: a restored layer would pin
      # `apt-get install ca-certificates ...` to whenever that layer was first built,
      # so a release could ship base packages months stale; and this workflow runs on
      # a tag ref, whose cache scope is not the one the PR check writes, so the
      # restore would likely miss while still exporting multi-GB against the repo's
      # 10 GB quota - which ~14 other jobs share for their pnpm caches. A few
      # uncached minutes a handful of times a year is the cheaper side of that trade.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      # A multi-platform build that silently produced one platform is the shape of
      # failure that shipped a broken image for three releases (#153, v1.4.0-v1.5.0):
      # the build log looks right and nothing checks the result. Read the platforms
      # back out of the pushed manifest instead of trusting the build.
      - name: Verify the published manifest lists both platforms
        run: |
          IMAGE="$GHCR_IMAGE:${{ steps.meta.outputs.version }}"
          PLATFORMS="$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')"
          echo "manifest platforms: $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            case " $PLATFORMS " in
              *" $want "*) ;;
              *)
                echo "::error::published manifest is missing $want (got: $PLATFORMS)"
                exit 1
                ;;
            esac
          done

      # A successful push only means the registry accepted the layers - it does
      # not mean the image runs. Pull it back from ghcr.io (not the local build
      # cache) and actually run it, the way `docker.yml` silently failing to
      # build at all went unnoticed for three releases (v1.4.0 - v1.5.0).
      #
      # Same script unit-test.yml runs against the image built on a PR, so the
      # published-image check and the PR check cannot drift apart (#230). The
      # version assertion is the one part only this job wants: the PR image has no
      # published version to match.
      - name: Verify the published image
        run: |
          IMAGE="$GHCR_IMAGE:${{ steps.meta.outputs.version }}"
          docker pull "$IMAGE"
          bash scripts/docker-smoke.sh \
            --image "$IMAGE" \
            --png-out /tmp/published.png \
            --expect-version "${{ steps.meta.outputs.version }}"

      # The byte checks prove a PNG came out, not that it has anything in it.
      # This job runs unattended, post-publish, with nobody watching it - keep
      # the render downloadable so a human can eyeball text rendering.
      - name: Upload the published image's PNG smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-published-png-smoke
          path: /tmp/published.png
          if-no-files-found: warn

  # A copy of the image `docker` just pushed and verified, not a second build:
  # `imagetools create` from a single source re-tags the existing index as-is, so
  # the Docker Hub image has the same digest as ghcr.io - and since BuildKit stores
  # the provenance and SBOM as attestation manifests *inside* that index, they come
  # along with it. A separate job rather than a second `images:` entry on the build
  # above, so an expired token or a Docker Hub outage can't fail or half-finish the
  # ghcr.io publish. ghcr.io stays the registry the docs point at: Docker Hub
  # rate-limits anonymous pulls, which shared CI runners hit.
  #
  # A personal Docker Hub namespace can't use OIDC (Docker only offers it to paid or
  # DSOS organizations), hence the token. It expires; when it does, this job fails
  # and report-failure below files the issue.
  dockerhub:
    runs-on: ubuntu-latest
    needs: docker
    # No tag guard of its own: on a release event this only runs once `docker` (which
    # has the guard) succeeded, and on a dispatch resolve-docker-tag.mjs rejects
    # anything but a core tag.
    if: ${{ !cancelled() && (needs.docker.result == 'success' || (needs.docker.result == 'skipped' && inputs.dockerhub_only)) }}
    permissions:
      contents: read

    steps:
      # The newest-release lookup lives in `docker`, which `dockerhub_only` skips, so
      # without this an empty tag would check out main and fail inside
      # resolve-docker-tag.mjs with a misleading issue.
      - name: Check a tag was given
        env:
          TAG: ${{ needs.docker.outputs.tag || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::dockerhub_only copies an existing image, so it needs a tag (e.g. sfn-diagram-v1.9.1)"
            exit 1
          fi

      # The tag, not main, so docker-smoke.sh and the font probes it reads match the
      # image being checked.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.docker.outputs.tag || inputs.tag }}

      # Same as the `docker` job's step (see the comment there).
      - name: Resolve version and derived tags
        id: version
        env:
          TAG: ${{ needs.docker.outputs.tag || inputs.tag }}
        run: node scripts/resolve-docker-tag.mjs --tag "$TAG"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The floating tags follow ghcr.io rather than this run: each one moves only if
      # the same tag on ghcr.io already points at this version. A `dockerhub_only`
      # run for an older tag - recovering a failed copy, or a backfill that lands
      # after a newer release - would otherwise drag Docker Hub's `latest` and
      # `<major>` back to that older version while ghcr.io's stay put. Reading each
      # digest into a variable first, rather than comparing inside `[ ]`, is what
      # makes a failed inspect stop the job instead of quietly skipping a tag.
      - name: Copy the ghcr.io image to Docker Hub
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FLOATING_TAGS: ${{ steps.version.outputs.major }} ${{ steps.version.outputs.minor }} latest
        run: |
          set -euo pipefail
          index_digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest
          }
          VERSION_DIGEST="$(index_digest "$GHCR_IMAGE:$VERSION")"
          TAGS=(--tag "$DOCKERHUB_IMAGE:$VERSION")
          for tag in $FLOATING_TAGS; do
            TAG_DIGEST="$(index_digest "$GHCR_IMAGE:$tag")"
            if [ "$TAG_DIGEST" = "$VERSION_DIGEST" ]; then
              TAGS+=(--tag "$DOCKERHUB_IMAGE:$tag")
            else
              echo "::notice::ghcr.io's $tag is a different release; leaving Docker Hub's $tag where it is"
            fi
          done
          docker buildx imagetools create "${TAGS[@]}" "$GHCR_IMAGE:$VERSION"

      # The whole claim this job rests on. A matching index digest means every
      # platform manifest and both attestation manifests are byte-identical to what
      # `docker` verified; a buildx that ever rewrote the index on copy fails here
      # instead of publishing a silently different image.
      - name: Verify the Docker Hub digest matches ghcr.io
        env:
          GHCR_REF: ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
          HUB_REF: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}
        run: |
          # The default `run:` shell has no pipefail, so a failed inspect would only
          # surface later as a confusing "digest '' does not match". Stop on the
          # registry's own error instead.
          set -euo pipefail
          GHCR_DIGEST="$(docker buildx imagetools inspect "$GHCR_REF" --format '{{json .Manifest}}' | jq -r .digest)"
          HUB_DIGEST="$(docker buildx imagetools inspect "$HUB_REF" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "ghcr.io:    $GHCR_DIGEST"
          echo "Docker Hub: $HUB_DIGEST"
          # The real guard: two empty strings, or two `null`s from a field jq can't
          # find, would compare equal. Validating one side is enough - the other has
          # to match it exactly.
          if [[ ! "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not read the ghcr.io index digest (got '$GHCR_DIGEST')"
            exit 1
          fi
          if [ "$GHCR_DIGEST" != "$HUB_DIGEST" ]; then
            echo "::error::Docker Hub index digest $HUB_DIGEST does not match ghcr.io's $GHCR_DIGEST"
            exit 1
          fi

      # Every user pulls anonymously, and a repo accidentally left private would still
      # pass a logged-in pull. So ask with an anonymous token: a public repo answers
      # 200, a private or missing one 401. A HEAD rather than a pull, because Docker
      # Hub doesn't count HEADs toward its anonymous rate limit - a shared runner IP
      # that already spent its quota can't turn this into a false failure.
      - name: Verify Docker Hub serves the image anonymously
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          REPO="${DOCKERHUB_IMAGE#docker.io/}"
          TOKEN="$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$REPO:pull" | jq -r .token)"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --head \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://registry-1.docker.io/v2/$REPO/manifests/$VERSION")"
          if [ "$STATUS" != 200 ]; then
            echo "::error::anonymous HEAD of $DOCKERHUB_IMAGE:$VERSION returned $STATUS (401: repo private or missing; 404: tag missing)"
            exit 1
          fi

      # The digest check proves the bytes; this proves Docker Hub hands them out and
      # they run. Logged in, so it draws on the account's pull quota, not the runner
      # IP's anonymous one. The arm64 pull only fetches - it can't run without QEMU -
      # but a missing layer for that platform would fail it.
      - name: Verify the Docker Hub image runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/docker-smoke.sh \
            --image "$DOCKERHUB_IMAGE:$VERSION" \
            --png-out /tmp/dockerhub.png \
            --expect-version "$VERSION"
          docker pull --platform linux/arm64 "$DOCKERHUB_IMAGE:$VERSION"

  # Notify-only by design: it scans what `docker` already pushed and does not gate
  # `dockerhub`, so an advisory filed the day of a release can't hold back that
  # release's image. A failure reaches report-failure. Scans the pushed digest on
  # both platforms. `--ignore-unfixed` because Debian's will_not_fix/fix_deferred
  # residue has no fix to take (that is #555). Trivy is pinned by digest because
  # trivy-action and trivy v0.69.4 were compromised in March 2026, and pulled from
  # ghcr.io rather than Docker Hub for its anonymous-pull limit.
  scan:
    name: Scan the published image
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      issues: write
    steps:
      - name: Scan both platforms for fixable high and critical vulnerabilities
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ needs.docker.outputs.digest }}
          TRIVY: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          set -euo pipefail
          status=0
          for platform in linux/amd64 linux/arm64; do
            echo "== $platform"
            docker run --rm -v trivy-cache:/root/.cache "$TRIVY" image \
              --image-src remote --platform "$platform" --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE" || status=1
          done
          exit "$status"

      # Runs only after a green scan. The token lives on this step alone, so the
      # Trivy container never sees one.
      - name: Close the scan tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.docker.outputs.tag }}
          TITLE: ${{ env.SCAN_ISSUE_TITLE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label docker-publish \
            --search "$TITLE in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "The scan of \`$TAG\` passed on both platforms: $RUN_URL"
          fi

  # `docker` or `dockerhub` failing (or a verification step catching a broken image)
  # has no human "actor" to notify - it's triggered by a release event or the weekly
  # schedule, not a click. File an issue so a broken image can't silently sit
  # unnoticed the way it did for three releases in a row.
  report-failure:
    name: Report Docker publish failure
    needs: [docker, dockerhub, scan]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The tag through env, like the resolve steps: this job runs precisely when a
      # dispatch tag failed validation, so it's the one place an unvalidated value
      # would otherwise reach a shell - one holding an `issues: write` token.
      #
      # An open issue with the same title gets a comment instead of a new issue, or
      # the weekly run would file 52 a year. The title is matched exactly: GitHub
      # search tokenizes, so `sfn-diagram-v1.10.1` and `sfn-diagram-v1.1.10` collide.
      - name: File or update an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.docker.outputs.tag || github.event.release.tag_name || inputs.tag || 'the newest core release' }}
          EVENT: ${{ github.event_name }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DOCKERHUB_RESULT: ${{ needs.dockerhub.result }}
          SCAN_RESULT: ${{ needs.scan.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$DOCKER_RESULT" = failure ] || [ "$DOCKERHUB_RESULT" = failure ]; then
            TITLE="Docker publish failed for $TAG"
            BODY="A Docker publish job failed for \`$TAG\` ($EVENT; docker: $DOCKER_RESULT, dockerhub: $DOCKERHUB_RESULT, scan: $SCAN_RESULT). \`docker\` builds, pushes and verifies the ghcr.io image; \`dockerhub\` copies it to Docker Hub - if only that one failed, check whether the \`DOCKERHUB_TOKEN\` secret expired, then re-run with \`dockerhub_only\` set and the same tag.

          Run: $RUN_URL"
          else
            TITLE="$SCAN_ISSUE_TITLE"
            BODY="The scan of \`$TAG\` ($EVENT) failed. The image was published to both registries; the scan found fixable HIGH or CRITICAL vulnerabilities, or Trivy itself failed - check the log. Base-image fixes usually land with the next weekly rebuild; a fix in a package the image installs needs a release. This issue closes itself on the next green scan.

          Run: $RUN_URL"
          fi
          export TITLE
          gh label create docker-publish --repo "$GITHUB_REPOSITORY" --force --color ededed \
            --description "Raised by docker.yml"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label docker-publish \
            --search "$TITLE in:title" --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label bug \
              --label docker-publish --body "$BODY"
          fi
