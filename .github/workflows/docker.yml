name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. sfn-diagram-v0.5.0)'
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    # Only build for sfn-diagram releases (legacy v* or sfn-diagram-v* tags),
    # never for another release-please component's tag (github-action-sfn-diagram-v*,
    # sfn-diagram-react-v*, vscode-sfn-diagram-v*) - every one of those contains a
    # hyphen before its own `-v`, which the legacy `v*` tags never do. See #127,
    # where vscode-sfn-diagram-v0.1.1 slipped past a startsWith(tag, 'v') check that
    # only excluded 'github-action'.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'sfn-diagram-v') || (startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, '-'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Resolves the exact version plus its major and major.minor prefixes from
      # the tag, for both trigger types — so `docker/metadata-action` below can
      # emit all four tags the docs promise (latest, <major>, <major>.<minor>,
      # <major>.<minor>.<patch>), not just the exact version and `latest`. Delegates
      # to scripts/resolve-docker-tag.mjs (unit tested in tests/ci/resolveDockerTag.test.ts)
      # which rejects anything but a core sfn-diagram tag outright, so a tag that
      # slips past the job-level `if:` above (or a bad workflow_dispatch input) fails
      # here instead of building and pushing an image under a mangled tag - see #127.
      - name: Resolve version and derived tags
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          node scripts/resolve-docker-tag.mjs --tag "$TAG"

      # QEMU for the linux/arm64 leg, buildx because the default docker driver
      # cannot emit a multi-platform image or use the GitHub Actions cache.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/yusufaf/sfn-diagram
          tags: |
            # Exact version first (docker/metadata-action's `version` output —
            # used below to verify the published image — resolves to the
            # first-listed tag among equal-priority `type=raw` entries).
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest

      # arm64 is built here and nowhere else: unit-test.yml's docker-build-check
      # *runs* the image it builds, and a multi-platform build cannot be loaded into
      # the runner's daemon at all. arm64 under QEMU costs several minutes, which is
      # worth paying a few times a year rather than on every PR - the price is that
      # a cross-arch build break surfaces at release time, which is what the
      # manifest assertion and the report-failure job below exist to make loud.
      #
      # provenance/sbom describe a published artifact, so they belong on this push
      # and would attest nothing in the PR check.
      #
      # No layer cache here, deliberately, though docker-build-check uses one. Two
      # reasons, both about publishing rather than speed: a restored layer would pin
      # `apt-get install ca-certificates ...` to whenever that layer was first built,
      # so a release could ship base packages months stale; and this workflow runs on
      # a tag ref, whose cache scope is not the one the PR check writes, so the
      # restore would likely miss while still exporting multi-GB against the repo's
      # 10 GB quota - which ~14 other jobs share for their pnpm caches. A few
      # uncached minutes a handful of times a year is the cheaper side of that trade.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      # A multi-platform build that silently produced one platform is the shape of
      # failure that shipped a broken image for three releases (#153, v1.4.0-v1.5.0):
      # the build log looks right and nothing checks the result. Read the platforms
      # back out of the pushed manifest instead of trusting the build.
      - name: Verify the published manifest lists both platforms
        run: |
          IMAGE="ghcr.io/yusufaf/sfn-diagram:${{ steps.meta.outputs.version }}"
          PLATFORMS="$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}')"
          echo "manifest platforms: $PLATFORMS"
          for want in linux/amd64 linux/arm64; do
            case " $PLATFORMS " in
              *" $want "*) ;;
              *)
                echo "::error::published manifest is missing $want (got: $PLATFORMS)"
                exit 1
                ;;
            esac
          done

      # A successful push only means the registry accepted the layers - it does
      # not mean the image runs. Pull it back from ghcr.io (not the local build
      # cache) and actually run it, the way `docker.yml` silently failing to
      # build at all went unnoticed for three releases (v1.4.0 - v1.5.0).
      #
      # Same script unit-test.yml runs against the image built on a PR, so the
      # published-image check and the PR check cannot drift apart (#230). The
      # version assertion is the one part only this job wants: the PR image has no
      # published version to match.
      - name: Verify the published image
        run: |
          IMAGE="ghcr.io/yusufaf/sfn-diagram:${{ steps.meta.outputs.version }}"
          docker pull "$IMAGE"
          bash scripts/docker-smoke.sh \
            --image "$IMAGE" \
            --png-out /tmp/published.png \
            --expect-version "${{ steps.meta.outputs.version }}"

      # The byte checks prove a PNG came out, not that it has anything in it.
      # This job runs unattended, post-publish, with nobody watching it - keep
      # the render downloadable so a human can eyeball text rendering.
      - name: Upload the published image's PNG smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-published-png-smoke
          path: /tmp/published.png
          if-no-files-found: warn

  # `docker` failing (or its verification step catching a broken image) has no
  # human "actor" to notify - it's triggered by a release event, not a click.
  # File an issue so a broken image can't silently sit unnoticed the way it did
  # for three releases in a row.
  report-failure:
    name: Report Docker publish failure
    needs: docker
    if: always() && needs.docker.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Docker publish failed for ${{ github.event.release.tag_name || inputs.tag }}" \
            --label bug \
            --body "The \`docker\` job (build, push, or the post-push verification) failed for \`${{ github.event.release.tag_name || inputs.tag }}\`.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
