name: Link Check

# Deliberately not on pull_request. External links rate-limit and flake, and a
# host having a bad afternoon must not block someone's PR - #199 asks for link
# checking because stale *outbound* claims (Marketplace parity, the Homebrew tap,
# Open VSX, jsr.io) survived undetected, and a weekly sweep catches those. Internal
# relative links already fail the site build, so they need nothing here.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Two passes, because a base URL is all-or-nothing. The site's docs use
      # root-relative links (`/quick-start/`), which lychee cannot resolve from the
      # markdown at all - measured against lycheeverse/lychee, they fail while the
      # request is built, before any --exclude pattern is consulted, so they cannot
      # be filtered out. `--base-url` resolves them against the deployed site, which
      # both silences the noise *and* checks them for real. But it also rewrites
      # ordinary relative links, so `[LICENSE](LICENSE)` in README.md would become an
      # HTTP 404. The repo's markdown has 3 relative links and no root-relative ones;
      # the site's content has 33 root-relative links and no relative ones. One pass
      # each, and neither has to compromise.
      #
      # No --accept for 429 in either: a rate-limited host is exactly how a dead link
      # would hide, so a persistent 429 after the retries is reported rather than
      # passed. Which makes the token load-bearing - there are 353 github.com URLs in
      # the checked files, 140 of them in CHANGELOG.md alone, and unauthenticated
      # requests at that volume are rate-limited well inside three retries.
      #
      # Two targeted exclusions, both verified against the first real run's report:
      #
      # - npmjs.com answers CI clients with 403 for every package page, so those URLs
      #   are remapped to the registry API instead of ignored. A renamed or
      #   unpublished package still 404s, which is half of what this job is for.
      # - README.marketplace.md links to a LICENSE that sync-action-mirror.sh places
      #   beside it in the Marketplace mirror repo. Correct there, unresolvable here,
      #   and only that one link is excluded so the rest of the file stays checked.
      - name: Check links in the repo's markdown
        id: repo-links
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200,204,206
            --remap 'https://www\.npmjs\.com/package/(.*) https://registry.npmjs.org/$1'
            --exclude 'github-action-sfn-diagram/LICENSE$'
            --exclude-path site
            --exclude-path node_modules
            '**/*.md'
          output: lychee-repo.md
          fail: true

      # if: always() so a failure in the pass above still lets this one report; the
      # job fails either way.
      - name: Check links in the site's content
        id: site-links
        if: always()
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200,204,206
            --base-url https://sfn.yusufaf.dev
            --remap 'https://www\.npmjs\.com/package/(.*) https://registry.npmjs.org/$1'
            'site/src/content/**/*.md'
            'site/src/content/**/*.mdx'
          output: lychee-site.md
          fail: true

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: |
            lychee-repo.md
            lychee-site.md
          if-no-files-found: warn

  # This workflow runs unattended on a schedule, so a failure has no human to
  # notify - the same reason docker.yml files an issue when its publish fails. One
  # tracking issue, reused: a weekly cron would otherwise open 52 a year.
  report-failure:
    name: Report broken links
    needs: links
    if: always() && needs.links.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # v8 pairs with upload-artifact@v7 above, the same pairing release-please.yml
      # already uses. continue-on-error because this job exists to notify a human
      # about an unattended failure: if lychee died before writing a report, the
      # download hard-errors with "Unable to find any artifacts" and the issue would
      # never be filed - the one case where silence is worst.
      - name: Download the report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: lychee-report

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Broken links found by the weekly link check
        run: |
          BODY_FILE="$(mktemp)"
          {
            echo "The scheduled link check found links that did not resolve."
            echo
            echo "Run: $RUN_URL"
            echo
            if [ -f lychee-repo.md ] || [ -f lychee-site.md ]; then
              for report in lychee-repo.md lychee-site.md; do
                [ -f "$report" ] || continue
                echo "## $report"
                echo
                cat "$report"
                echo
              done
            else
              echo "No report was produced - the check failed before writing one."
              echo "Read the run log linked above."
            fi
          } > "$BODY_FILE"

          # --force is create-or-update, so this is idempotent and keeps the
          # workflow from failing on a repo where the label does not exist yet.
          gh label create link-check --repo "$REPO" --force \
            --color ededed --description "Raised by the scheduled link check"

          EXISTING="$(gh issue list --repo "$REPO" --state open --label link-check \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
            echo "commented on #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --label link-check \
              --body-file "$BODY_FILE"
          fi
