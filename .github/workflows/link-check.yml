name: Link Check

# Deliberately not on pull_request. External links rate-limit and flake, and a
# host having a bad afternoon must not block someone's PR - #199 asks for link
# checking because stale *outbound* claims (Marketplace parity, the Homebrew tap,
# Open VSX, jsr.io) survived undetected, and a weekly sweep catches those. Internal
# relative links already fail the site build, so they need nothing here.
on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No --accept for 429: a rate-limited host is exactly how a dead link would
      # hide, so a persistent 429 after the retries is reported rather than passed.
      # Which makes the token load-bearing - the checked markdown holds 353
      # github.com URLs (140 in CHANGELOG.md alone), and unauthenticated requests at
      # that volume are rate-limited well inside three retries, so without it the
      # weekly run would file an issue every Monday about links that are fine.
      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Tuned from the first real run (95 errors, none of them a dead link):
          #
          # `--exclude '^/'` drops Starlight's root-relative links (`/quick-start/`).
          # They resolve against the built site, not the filesystem, so lychee reported
          # all 74 of them as unresolvable while reading the markdown. Nothing else
          # validates them either (see the follow-up issue), but this job exists for
          # outbound rot and 74 false errors a week would bury it.
          #
          # The CHANGELOG.md files are release-please's output: their `compare/` links
          # point at tags from before the current naming scheme, several of which never
          # existed. Rewriting generated history is not the point here.
          #
          # README.marketplace.md is built for the Marketplace mirror repo, where
          # scripts/sync-action-mirror.sh puts a LICENSE beside it - its relative links
          # are correct there and unresolvable in this repo.
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept 200,204,206
            --exclude '^/'
            --exclude-path site/dist
            --exclude-path node_modules
            --exclude-path CHANGELOG.md
            --exclude-path packages/github-action-sfn-diagram/CHANGELOG.md
            --exclude-path packages/sfn-diagram-react/CHANGELOG.md
            --exclude-path packages/vscode-sfn-diagram/CHANGELOG.md
            --exclude-path packages/github-action-sfn-diagram/README.marketplace.md
            '**/*.md'
            'site/src/content/**/*.md'
            'site/src/content/**/*.mdx'
          output: lychee-report.md
          fail: true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: lychee-report.md
          if-no-files-found: warn

  # This workflow runs unattended on a schedule, so a failure has no human to
  # notify - the same reason docker.yml files an issue when its publish fails. One
  # tracking issue, reused: a weekly cron would otherwise open 52 a year.
  report-failure:
    name: Report broken links
    needs: links
    if: always() && needs.links.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # v8 pairs with upload-artifact@v7 above, the same pairing release-please.yml
      # already uses. continue-on-error because this job exists to notify a human
      # about an unattended failure: if lychee died before writing a report, the
      # download hard-errors with "Unable to find any artifacts" and the issue would
      # never be filed - the one case where silence is worst.
      - name: Download the report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: lychee-report

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Broken links found by the weekly link check
        run: |
          BODY_FILE="$(mktemp)"
          {
            echo "The scheduled link check found links that did not resolve."
            echo
            echo "Run: $RUN_URL"
            echo
            if [ -f lychee-report.md ]; then
              cat lychee-report.md
            else
              echo "No report was produced - the check failed before writing one."
              echo "Read the run log linked above."
            fi
          } > "$BODY_FILE"

          # --force is create-or-update, so this is idempotent and keeps the
          # workflow from failing on a repo where the label does not exist yet.
          gh label create link-check --repo "$REPO" --force \
            --color ededed --description "Raised by the scheduled link check"

          EXISTING="$(gh issue list --repo "$REPO" --state open --label link-check \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file "$BODY_FILE"
            echo "commented on #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --label link-check \
              --body-file "$BODY_FILE"
          fi
