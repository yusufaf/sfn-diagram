name: Release Message

# Fails a PR whose squash message release-please would silently drop (#387). The
# squash message is rebuilt from the PR title and commits, so `edited` re-runs this
# when a title is fixed or a BEGIN_COMMIT_OVERRIDE block is added to the body.
permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  parse:
    name: release-please can parse the squash message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --ignore-scripts

      - name: Parse the would-be squash message
        run: pnpm run check:release-message --pr "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
