name: release-please

on:
  push:
    branches:
      - main
      - master
  # Manual/recovery run for a core release tag: re-runs every core publish job
  # idempotently. npm and JSR skip when the version is already there; the
  # binaries, SHA256SUMS, and Homebrew formula are rebuilt and overwritten.
  # Use it when a release tag exists but one of those jobs failed.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Core release tag to (re)publish, e.g. sfn-diagram-v1.6.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      action_release_created: ${{ steps.release.outputs['packages/github-action-sfn-diagram--release_created'] }}
      action_tag_name: ${{ steps.release.outputs['packages/github-action-sfn-diagram--tag_name'] }}
      react_release_created: ${{ steps.release.outputs['packages/sfn-diagram-react--release_created'] }}
      react_tag_name: ${{ steps.release.outputs['packages/sfn-diagram-react--tag_name'] }}
      vscode_release_created: ${{ steps.release.outputs['packages/vscode-sfn-diagram--release_created'] }}
      vscode_tag_name: ${{ steps.release.outputs['packages/vscode-sfn-diagram--tag_name'] }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish to npm when merging the release PR cut a release, or when manually
  # dispatched for a specific tag. Uses npm Trusted Publisher (OIDC) —
  # id-token: write, no NPM_TOKEN needed.
  npm-publish:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' &&
        startsWith(github.event.inputs.publish_tag, 'sfn-diagram-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # PNG export (node-html-to-image) launches puppeteer with headless: "shell",
      # so it needs the chrome-headless-shell binary — not just chrome. Install
      # both explicitly; --frozen-lockfile skips puppeteer's postinstall, so we
      # cannot rely on that to populate the browser cache.
      - name: Install browsers for Puppeteer
        run: |
          pnpm exec puppeteer browsers install chrome
          pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Validate package
        run: pnpm run validate

      # On a manual re-run for a tag whose npm publish already succeeded (but
      # whose binaries or another job failed), skip instead of dying on "cannot
      # publish over previously published version". Only on dispatch: a push-
      # triggered release that finds its version already taken is a real
      # problem and must fail loudly.
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "$(npm view sfn-diagram@"$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "sfn-diagram@$VERSION is already on npm, skipping publish"
            exit 0
          fi
          npm publish --provenance --access public

      # A successful `npm publish` only means the registry accepted the
      # tarball - it says nothing about whether the package actually installs
      # and runs. The registry can also lag a minute or so before a fresh
      # publish is visible. Poll for it, then actually run the published CLI.
      #
      # The npx run happens from an empty temp dir: run from the checkout, npm
      # resolves `sfn-diagram` to the repo's own root package, installs nothing,
      # and execs a bin that was never linked ("sfn-diagram: not found"), which
      # is what failed the 1.6.0 release although the package was fine.
      - name: Verify the published version on npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FOUND=""
          for i in $(seq 1 20); do
            if [ "$(npm view sfn-diagram@"$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              FOUND=1
              break
            fi
            sleep 15
          done
          if [ -z "$FOUND" ]; then
            echo "::error::npm registry never showed sfn-diagram@$VERSION after publish"
            exit 1
          fi
          # Compare stdout only (stderr stays on the job log): npm writes a
          # deprecation warning for the runner's .npmrc `always-auth` key to
          # stderr, which failed the 1.6.1 check although the CLI printed the
          # right version.
          cd "$(mktemp -d)"
          set +e
          OUTPUT="$(npx --yes sfn-diagram@"$VERSION" --version)"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] || [ "$OUTPUT" != "$VERSION" ]; then
            echo "::error::npx sfn-diagram@$VERSION --version exited $STATUS with stdout '$OUTPUT', expected '$VERSION'"
            exit 1
          fi

  # Publish to JSR (jsr.io) alongside npm. JSR reads TypeScript source directly,
  # so no build/browser install is needed. Tokenless OIDC — id-token: write, no
  # secret. Requires the JSR package to be linked to this GitHub repo (one-time,
  # in JSR package settings). `jsr publish` no-ops if the version already exists,
  # so this is safe on both release merges and manual dispatch.
  jsr-publish:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' &&
        startsWith(github.event.inputs.publish_tag, 'sfn-diagram-v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish to JSR
        run: npx jsr publish

      # `jsr publish` exiting 0 doesn't guarantee jsr.io serves the new version
      # yet. Poll its own metadata endpoint rather than trusting the exit code.
      # Check for this exact version rather than `.latest`, so a recovery
      # dispatch for an older tag still passes once a newer release exists.
      - name: Verify the published version on JSR
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FOUND=""
          for i in $(seq 1 20); do
            if curl -fsSL https://jsr.io/@yusufaf/sfn-diagram/meta.json \
                | jq -e --arg v "$VERSION" '.versions[$v] != null' >/dev/null 2>&1; then
              FOUND=1
              break
            fi
            sleep 15
          done
          if [ -z "$FOUND" ]; then
            echo "::error::JSR never showed @yusufaf/sfn-diagram@$VERSION after publish"
            exit 1
          fi

  # Publish the React wrapper to npm when release-please cut a release for it.
  # Versioned independently of the core package, so it gets its own tag and its
  # own job. Same Trusted Publisher (OIDC) setup as npm-publish — no NPM_TOKEN.
  react-npm-publish:
    needs: release-please
    if: needs.release-please.outputs.react_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.react_tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The React package imports the core package, so core dist/ must exist
      # before the wrapper can typecheck, test, or build against it.
      - name: Build core
        run: pnpm run build

      - name: Build
        run: pnpm --filter sfn-diagram-react run build

      - name: Lint
        run: pnpm --filter sfn-diagram-react run lint

      - name: Typecheck
        run: pnpm --filter sfn-diagram-react run typecheck

      - name: Test
        run: pnpm --filter sfn-diagram-react run test

      - name: Validate package
        run: pnpm --filter sfn-diagram-react run validate

      # `npm publish` does not rewrite the `workspace:` protocol the way
      # `pnpm publish` does. The manifest therefore declares a real semver range
      # for its `sfn-diagram` peer; this guard fails the release if that ever
      # regresses, rather than shipping an uninstallable package.
      - name: Assert no workspace protocol in published deps
        run: |
          node -e "
            const pkg = require('./packages/sfn-diagram-react/package.json');
            const published = { ...pkg.dependencies, ...pkg.peerDependencies };
            const offenders = Object.entries(published).filter(([, range]) => String(range).startsWith('workspace:'));
            if (offenders.length) {
              console.error('workspace: protocol would be published:', offenders);
              process.exit(1);
            }
          "

      # Skip when already published so "Re-run failed jobs" after a verify
      # timeout doesn't die on "cannot publish over previously published version".
      - name: Publish to npm
        working-directory: packages/sfn-diagram-react
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view sfn-diagram-react@"$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "sfn-diagram-react@$VERSION is already on npm, skipping publish"
            exit 0
          fi
          npm publish --provenance --access public

      - name: Verify the published version on npm
        run: |
          VERSION="$(node -p "require('./packages/sfn-diagram-react/package.json').version")"
          FOUND=""
          for i in $(seq 1 20); do
            if [ "$(npm view sfn-diagram-react@"$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              FOUND=1
              break
            fi
            sleep 15
          done
          if [ -z "$FOUND" ]; then
            echo "::error::npm registry never showed sfn-diagram-react@$VERSION after publish"
            exit 1
          fi

  # Publish the VS Code extension to Open VSX when release-please cut a release
  # for it. Open VSX is the default registry for Cursor, Windsurf, VSCodium,
  # Gitpod and Eclipse Theia.
  #
  # The Microsoft Marketplace is deliberately NOT automated here. `vsce publish`
  # requires a *global* Azure DevOps PAT, and global PATs are retired on
  # 2026-12-01; the supported replacement is Entra workload identity federation
  # (`vsce publish --azure-credential`), which is tracked separately in #40.
  # Open VSX uses its own token and is unaffected by that cutoff.
  openvsx-publish:
    needs: release-please
    if: needs.release-please.outputs.vscode_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.vscode_tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # esbuild bundles the core package into out/extension.js, so core dist/
      # must exist before the extension can build.
      - name: Build core
        run: pnpm run build

      - name: Typecheck
        run: pnpm --filter vscode-sfn-diagram run typecheck

      - name: Build
        run: pnpm --filter vscode-sfn-diagram run build

      # --no-dependencies: the extension is a single esbuild bundle, so there is
      # no node_modules tree to pack.
      - name: Package
        run: pnpm --filter vscode-sfn-diagram run package

      # ovsx reads the token from OVSX_PAT. Passing it as `-p` instead would put
      # it in the process argument list; the env var keeps it out.
      # --skip-duplicate so a re-run of a partially failed release is a no-op
      # rather than a hard failure.
      - name: Publish to Open VSX
        working-directory: packages/vscode-sfn-diagram
        run: pnpm exec ovsx publish vscode-sfn-diagram-*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Verify the published version on Open VSX
        run: |
          VERSION="$(node -p "require('./packages/vscode-sfn-diagram/package.json').version")"
          FOUND=""
          for i in $(seq 1 20); do
            ACTUAL="$(curl -fsSL https://open-vsx.org/api/yusufaf/vscode-sfn-diagram | jq -r .version 2>/dev/null || true)"
            if [ "$ACTUAL" = "$VERSION" ]; then
              FOUND=1
              break
            fi
            sleep 15
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Open VSX never showed yusufaf.vscode-sfn-diagram@$VERSION after publish (last seen: $ACTUAL)"
            exit 1
          fi

  # Sync the bundled action to its Marketplace mirror repo when release-please
  # cut a new action release. Mirrors the npm-publish flow, but pushes to the
  # standalone yusufaf/sfn-diagram-action repo instead of npm.
  mirror-sync:
    needs: release-please
    if: needs.release-please.outputs.action_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A token scoped to the mirror repo. The release GitHub App must be
      # installed on yusufaf/sfn-diagram-action with Contents: write.
      - name: Mint mirror-scoped token
        uses: actions/create-github-app-token@v3
        id: mirror-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: yusufaf
          repositories: sfn-diagram-action

      - name: Checkout released action tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.action_tag_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The action bundles the root sfn-diagram package, so its dist/ must exist
      # before the sync script rebuilds the action bundle against it.
      - name: Build core
        run: pnpm run build

      - name: Sync action to Marketplace mirror
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: bash scripts/sync-action-mirror.sh

      - name: Verify the mirror release
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: |
          VERSION="$(node -p "require('./packages/github-action-sfn-diagram/package.json').version")"
          gh release view "v$VERSION" --repo yusufaf/sfn-diagram-action >/dev/null || {
            echo "::error::Mirror release v$VERSION not found on yusufaf/sfn-diagram-action"
            exit 1
          }

  # Standalone CLI executables (bun build --compile) attached to the GitHub
  # Release so people without Node can `curl` one binary. Built from the same
  # dist/ the npm package ships. macOS assets are built on a macOS runner
  # because the signature bun writes cannot be trusted (see the re-sign step)
  # and only macOS has `codesign` to replace it and launch the result; an
  # unsigned or mis-signed arm64 binary is SIGKILLed before it prints anything.
  # On manual dispatch only run for a core tag: a subpackage tag (react, vscode,
  # action) has its own release, and uploading core binaries to it would both
  # mislabel that release and feed the Homebrew formula the wrong URLs.
  binaries:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' &&
        startsWith(github.event.inputs.publish_tag, 'sfn-diagram-v')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --target bun-linux-x64 --target bun-linux-arm64 --target bun-windows-x64
          - os: macos-latest
            targets: --target bun-darwin-arm64 --target bun-darwin-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build core
        run: pnpm run build

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build binaries
        run: pnpm run build:binary ${{ matrix.targets }}

      # bun ad-hoc signs the Mach-O it emits, but the signature it wrote for
      # the cross-architecture darwin-x64 target failed `codesign --verify` on
      # the 1.6.0 release ("code or signature have been modified"), which
      # macOS treats as SIGKILL-on-launch. Replace both signatures with an
      # ad-hoc one from the system codesign (--force overwrites the existing
      # signature), verify, then actually launch the binaries: a valid
      # signature proves the bytes match, not that the executable runs.
      - name: Re-sign, verify, and smoke-test macOS binaries
        if: runner.os == 'macOS'
        run: |
          for binary in binaries/sfn-diagram-darwin-*; do
            codesign --force --sign - "$binary"
            codesign --verify --verbose=2 "$binary"
          done
          bash scripts/smoke-test-binary.sh binaries/sfn-diagram-darwin-arm64
          # The x64 binary can only run here under Rosetta; launch it when
          # the runner image has Rosetta, otherwise say so rather than skip
          # silently.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            VERSION="$(node -p "require('./package.json').version")"
            ACTUAL="$(arch -x86_64 binaries/sfn-diagram-darwin-x64 --version)"
            [ "$ACTUAL" = "$VERSION" ] || {
              echo "::error::darwin-x64 binary reported '$ACTUAL', expected '$VERSION'"
              exit 1
            }
          else
            echo "::warning::Rosetta not available on this runner; darwin-x64 binary was signed and verified but not launched"
          fi

      # --clobber so a re-run of a partially failed release replaces the asset
      # instead of failing on "already exists".
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}"
          gh release upload "$TAG" binaries/sfn-diagram-* --clobber

  # Pull every uploaded binary back down, publish a SHA256SUMS next to them, and
  # smoke-test the Linux one the way a user would receive it - from the release,
  # not from the build directory.
  binaries-verify:
    needs: [release-please, binaries]
    if: always() && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # The smoke test compares the binary's SVG against node dist/cli.js.
      - name: Build core
        run: pnpm run build

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}"
          gh release download "$TAG" --pattern 'sfn-diagram-*' --dir binaries
          ls -l binaries
          [ "$(ls binaries | wc -l)" -eq 5 ] || {
            echo "::error::expected 5 binaries on release $TAG"
            exit 1
          }

      # Smoke test before publishing checksums, so a broken binary set never
      # carries a SHA256SUMS that makes it look verified.
      - name: Smoke test the released linux-x64 binary
        run: bash scripts/smoke-test-binary.sh binaries/sfn-diagram-linux-x64

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}"
          (cd binaries && sha256sum sfn-diagram-* > SHA256SUMS)
          cat binaries/SHA256SUMS
          gh release upload "$TAG" binaries/SHA256SUMS --clobber

      - name: Keep SHA256SUMS for the Homebrew job
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums
          path: binaries/SHA256SUMS

  # Regenerate the Homebrew formula from the release checksums and push it to
  # the tap repo. Opt-in: set the HOMEBREW_TAP_REPO repository variable to the
  # tap's repo name (e.g. `homebrew-tap`, under the same owner) once that repo
  # exists and the release GitHub App is installed on it with Contents: write.
  # Until then this job is skipped rather than failing every release.
  homebrew-tap:
    needs: [release-please, binaries-verify]
    if: always() && needs.binaries-verify.result == 'success' && vars.HOMEBREW_TAP_REPO != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint tap-scoped token
        uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.HOMEBREW_TAP_REPO }}

      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - name: Download SHA256SUMS
        uses: actions/download-artifact@v4
        with:
          name: sha256sums
          path: binaries

      - name: Render the formula
        run: |
          TAG="${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}"
          node scripts/generate-homebrew-formula.mjs \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --sums binaries/SHA256SUMS > sfn-diagram.rb
          cat sfn-diagram.rb

      - name: Push to the tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          TAP="${{ github.repository_owner }}/${{ vars.HOMEBREW_TAP_REPO }}"
          VERSION="$(node -p "require('./package.json').version")"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp sfn-diagram.rb tap/Formula/sfn-diagram.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sfn-diagram.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "sfn-diagram ${VERSION}"
          # -u origin HEAD: a freshly created, empty tap has an unborn default
          # branch with no upstream, and a bare `git push` fails there.
          git push -u origin HEAD

  # None of the publish jobs above are triggered by a human clicking something -
  # a failure has no "actor" to notify. File an issue so a broken publish to any
  # registry can't silently sit in the Actions tab unnoticed the way the Docker
  # image did for three releases before this was added.
  report-publish-failure:
    name: Report publish failure
    needs: [release-please, npm-publish, jsr-publish, react-npm-publish, openvsx-publish, mirror-sync, binaries, binaries-verify, homebrew-tap]
    if: |
      always() &&
      (needs.npm-publish.result == 'failure' ||
       needs.binaries.result == 'failure' ||
       needs.binaries-verify.result == 'failure' ||
       needs.homebrew-tap.result == 'failure' ||
       needs.jsr-publish.result == 'failure' ||
       needs.react-npm-publish.result == 'failure' ||
       needs.openvsx-publish.result == 'failure' ||
       needs.mirror-sync.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Release publish failure: ${{ needs.release-please.outputs.tag_name || github.event.inputs.publish_tag }}" \
            --label bug \
            --body "One or more publish jobs failed (or their post-publish verification did).

          | Job | Result |
          |---|---|
          | npm-publish | ${{ needs.npm-publish.result }} |
          | jsr-publish | ${{ needs.jsr-publish.result }} |
          | react-npm-publish | ${{ needs.react-npm-publish.result }} |
          | openvsx-publish | ${{ needs.openvsx-publish.result }} |
          | mirror-sync | ${{ needs.mirror-sync.result }} |
          | binaries | ${{ needs.binaries.result }} |
          | binaries-verify | ${{ needs.binaries-verify.result }} |
          | homebrew-tap | ${{ needs.homebrew-tap.result }} |

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
