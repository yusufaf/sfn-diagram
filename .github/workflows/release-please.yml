name: release-please

on:
  push:
    branches:
      - main
      - master
  # Manual/recovery publish: build an existing tag and publish it to npm.
  # Useful when a release tag was created but the publish step failed.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Git tag to build and publish to npm (e.g. sfn-diagram-v0.5.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      action_release_created: ${{ steps.release.outputs['packages/github-action-sfn-diagram--release_created'] }}
      action_tag_name: ${{ steps.release.outputs['packages/github-action-sfn-diagram--tag_name'] }}
      react_release_created: ${{ steps.release.outputs['packages/sfn-diagram-react--release_created'] }}
      react_tag_name: ${{ steps.release.outputs['packages/sfn-diagram-react--tag_name'] }}
      vscode_release_created: ${{ steps.release.outputs['packages/vscode-sfn-diagram--release_created'] }}
      vscode_tag_name: ${{ steps.release.outputs['packages/vscode-sfn-diagram--tag_name'] }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish to npm when merging the release PR cut a release, or when manually
  # dispatched for a specific tag. Uses npm Trusted Publisher (OIDC) —
  # id-token: write, no NPM_TOKEN needed.
  npm-publish:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # PNG export (node-html-to-image) launches puppeteer with headless: "shell",
      # so it needs the chrome-headless-shell binary — not just chrome. Install
      # both explicitly; --frozen-lockfile skips puppeteer's postinstall, so we
      # cannot rely on that to populate the browser cache.
      - name: Install browsers for Puppeteer
        run: |
          pnpm exec puppeteer browsers install chrome
          pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Validate package
        run: pnpm run validate

      - name: Publish to npm
        run: npm publish --provenance --access public

  # Publish to JSR (jsr.io) alongside npm. JSR reads TypeScript source directly,
  # so no build/browser install is needed. Tokenless OIDC — id-token: write, no
  # secret. Requires the JSR package to be linked to this GitHub repo (one-time,
  # in JSR package settings). `jsr publish` no-ops if the version already exists,
  # so this is safe on both release merges and manual dispatch.
  jsr-publish:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish to JSR
        run: npx jsr publish

  # Publish the React wrapper to npm when release-please cut a release for it.
  # Versioned independently of the core package, so it gets its own tag and its
  # own job. Same Trusted Publisher (OIDC) setup as npm-publish — no NPM_TOKEN.
  react-npm-publish:
    needs: release-please
    if: needs.release-please.outputs.react_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.react_tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The React package imports the core package, so core dist/ must exist
      # before the wrapper can typecheck, test, or build against it.
      - name: Build core
        run: pnpm run build

      - name: Build
        run: pnpm --filter sfn-diagram-react run build

      - name: Lint
        run: pnpm --filter sfn-diagram-react run lint

      - name: Typecheck
        run: pnpm --filter sfn-diagram-react run typecheck

      - name: Test
        run: pnpm --filter sfn-diagram-react run test

      - name: Validate package
        run: pnpm --filter sfn-diagram-react run validate

      # `npm publish` does not rewrite the `workspace:` protocol the way
      # `pnpm publish` does. The manifest therefore declares a real semver range
      # for its `sfn-diagram` peer; this guard fails the release if that ever
      # regresses, rather than shipping an uninstallable package.
      - name: Assert no workspace protocol in published deps
        run: |
          node -e "
            const pkg = require('./packages/sfn-diagram-react/package.json');
            const published = { ...pkg.dependencies, ...pkg.peerDependencies };
            const offenders = Object.entries(published).filter(([, range]) => String(range).startsWith('workspace:'));
            if (offenders.length) {
              console.error('workspace: protocol would be published:', offenders);
              process.exit(1);
            }
          "

      - name: Publish to npm
        working-directory: packages/sfn-diagram-react
        run: npm publish --provenance --access public

  # Publish the VS Code extension to Open VSX when release-please cut a release
  # for it. Open VSX is the default registry for Cursor, Windsurf, VSCodium,
  # Gitpod and Eclipse Theia.
  #
  # The Microsoft Marketplace is deliberately NOT automated here. `vsce publish`
  # requires a *global* Azure DevOps PAT, and global PATs are retired on
  # 2026-12-01; the supported replacement is Entra workload identity federation
  # (`vsce publish --azure-credential`), which is tracked separately in #40.
  # Open VSX uses its own token and is unaffected by that cutoff.
  openvsx-publish:
    needs: release-please
    if: needs.release-please.outputs.vscode_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.vscode_tag_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # esbuild bundles the core package into out/extension.js, so core dist/
      # must exist before the extension can build.
      - name: Build core
        run: pnpm run build

      - name: Typecheck
        run: pnpm --filter vscode-sfn-diagram run typecheck

      - name: Build
        run: pnpm --filter vscode-sfn-diagram run build

      # --no-dependencies: the extension is a single esbuild bundle, so there is
      # no node_modules tree to pack.
      - name: Package
        run: pnpm --filter vscode-sfn-diagram run package

      # ovsx reads the token from OVSX_PAT. Passing it as `-p` instead would put
      # it in the process argument list; the env var keeps it out.
      # --skip-duplicate so a re-run of a partially failed release is a no-op
      # rather than a hard failure.
      - name: Publish to Open VSX
        working-directory: packages/vscode-sfn-diagram
        run: pnpm exec ovsx publish vscode-sfn-diagram-*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # Sync the bundled action to its Marketplace mirror repo when release-please
  # cut a new action release. Mirrors the npm-publish flow, but pushes to the
  # standalone yusufaf/sfn-diagram-action repo instead of npm.
  mirror-sync:
    needs: release-please
    if: needs.release-please.outputs.action_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A token scoped to the mirror repo. The release GitHub App must be
      # installed on yusufaf/sfn-diagram-action with Contents: write.
      - name: Mint mirror-scoped token
        uses: actions/create-github-app-token@v3
        id: mirror-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: yusufaf
          repositories: sfn-diagram-action

      - name: Checkout released action tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.action_tag_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The action bundles the root sfn-diagram package, so its dist/ must exist
      # before the sync script rebuilds the action bundle against it.
      - name: Build core
        run: pnpm run build

      - name: Sync action to Marketplace mirror
        env:
          GH_TOKEN: ${{ steps.mirror-token.outputs.token }}
        run: bash scripts/sync-action-mirror.sh
