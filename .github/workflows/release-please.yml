name: release-please

on:
  push:
    branches:
      - main
      - master
  # Manual/recovery publish: build an existing tag and publish it to npm.
  # Useful when a release tag was created but the publish step failed.
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Git tag to build and publish to npm (e.g. sfn-diagram-v0.5.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish to npm when merging the release PR cut a release, or when manually
  # dispatched for a specific tag. Uses npm Trusted Publisher (OIDC) —
  # id-token: write, no NPM_TOKEN needed.
  npm-publish:
    needs: release-please
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # PNG export (node-html-to-image) launches puppeteer with headless: "shell",
      # so it needs the chrome-headless-shell binary — not just chrome. Install
      # both explicitly; --frozen-lockfile skips puppeteer's postinstall, so we
      # cannot rely on that to populate the browser cache.
      - name: Install browsers for Puppeteer
        run: |
          pnpm exec puppeteer browsers install chrome
          pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Validate package
        run: pnpm run validate

      - name: Publish to npm
        run: npm publish --provenance --access public
