name: Step Functions Diagram Preview

on:
  pull_request:
    paths:
      - '**/*.asl.json'
      - '**/*.asl'

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The action's manifest is committed as action.template.yml, never as
      # action.yml — a real action.yml in this subdirectory makes GitHub treat the
      # monorepo as the canonical action and suppress the Marketplace mirror (#18).
      # A local `uses:` needs a real manifest though, so render one at run time.
      # This mirrors what scripts/sync-action-mirror.sh does for the mirror repo.
      - name: Render action manifest
        run: |
          sed '/^#/d' packages/github-action-sfn-diagram/action.template.yml \
            > packages/github-action-sfn-diagram/action.yml

      - name: Preview Step Functions diagrams
        id: preview
        uses: ./packages/github-action-sfn-diagram
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          asl-glob: '**/*.asl.json,**/*.asl'
          hide-catch: 'true'
          theme: 'dark'
          layout: 'LR'

      - name: Assert the action's outputs are readable downstream
        run: |
          echo "changed-count: ${{ steps.preview.outputs.changed-count }}"
          echo "changed-files: ${{ steps.preview.outputs.changed-files }}"
          echo "comment-id:    ${{ steps.preview.outputs.comment-id }}"
          echo "comment-url:   ${{ steps.preview.outputs.comment-url }}"
          test -n "${{ steps.preview.outputs.changed-count }}"
          echo '${{ steps.preview.outputs.changed-files }}' | jq -e 'type == "array"'
