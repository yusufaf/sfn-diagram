name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Git Bash on the Windows runner: the tarball smoke test and the shell
    # snippets below are POSIX-only.
    defaults:
      run:
        shell: bash
    strategy:
      # A platform-specific failure in one leg should not hide a different one
      # in another - the whole point of the matrix is seeing all of them at once.
      fail-fast: false
      matrix:
        include:
          # The primary leg additionally carries every check whose result cannot
          # depend on the platform or the Node version: lint, typecheck,
          # publint/attw and the committed Action-bundle drift check. Running
          # those four times over would buy three identical answers.
          - os: ubuntu-latest
            node: lts/*
            primary: true
          # engines.node says >=20 and nothing ever tested that floor. It is a
          # claim about the *published* artifact, not about building the repo:
          # tsdown@0.23.0 calls Promise.withResolvers (Node 22.0+), so
          # `pnpm run build` cannot run on 20 at all. This leg therefore builds
          # under Node 22 and switches back to 20 to run everything against the
          # result - see the two `matrix.node == '20'` steps below.
          - os: ubuntu-latest
            node: '20'
            primary: false
          # 22 covers the version between the floor and whatever lts/* resolves to.
          - os: ubuntu-latest
            node: '22'
            primary: false
          # Neither platform had ever run a test on a PR before this, despite the
          # libuv exit-9 workaround in src/bin.ts being Windows-specific and the
          # binary-signing hardening in 8896b98 being macOS-specific.
          - os: macos-latest
            node: lts/*
            primary: false
          - os: windows-latest
            node: lts/*
            primary: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install

      # PNG export (node-html-to-image) launches puppeteer 25.3.0 with
      # headless: "shell", so it needs the chrome-headless-shell binary in
      # puppeteer's cache (~/.cache/puppeteer) — not just chrome. Install both
      # explicitly rather than relying on puppeteer's postinstall, which pnpm may
      # skip. No PUPPETEER_EXECUTABLE_PATH needed (Turbo strict env would strip it).
      - name: Install browsers for Puppeteer
        run: |
          pnpm exec puppeteer browsers install chrome
          pnpm exec puppeteer browsers install chrome-headless-shell

      # Before Build, deliberately. sfn-diagram#build runs build:manifest, which
      # rewrites custom-elements.json in the working tree - so the same check inside
      # `pnpm test` below can only ever pass in CI, and a PR that edited an element
      # JSDoc without regenerating the manifest would go green. Run against the
      # checkout as committed instead.
      #
      # A `git diff --exit-code` here, like the Action-bundle check, would not work:
      # the committed manifest carries `\r\n` escaped inside its JSON strings from
      # whichever Windows machine generated it, and a Linux rebuild emits `\n`, so
      # every run would report drift. check-manifest.mjs compares with both real and
      # escaped line endings normalized, which is exactly that difference.
      - name: Verify custom-elements.json is up to date
        run: node scripts/check-manifest.mjs --check

      # The build toolchain's own floor is higher than the package's: tsdown@0.23.0
      # declares engines.node ^22.18.0 || ^24.11.0 || >=26 and calls
      # Promise.withResolvers, added in Node 22.0, so `tsdown` dies on Node 20 with
      # "Promise.withResolvers is not a function". engines.node ">=20" is a promise
      # about the published artifact - which tsdown compiles for node20.0.0 - so the
      # floor leg builds here under 22 and drops back to 20 for the tests.
      - name: Set node 22 to build on the node-20 leg
        if: matrix.node == '20'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # Build every workspace (core + react, vscode, github-action, playground)
      # so package build breakage is caught, not just the core library.
      - name: Build
        run: pnpm turbo run build

      - name: Back to node ${{ matrix.node }} to run against the built output
        if: matrix.node == '20'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Assert the runner is on node ${{ matrix.node }}
        run: |
          ACTUAL="$(node -p "process.versions.node.split('.')[0]")"
          EXPECTED='${{ matrix.node }}'
          # lts/* resolves to whatever is current; only the pinned legs are checkable.
          case "$EXPECTED" in
            [0-9]*)
              [ "$ACTUAL" = "$EXPECTED" ] || {
                echo "::error::expected node $EXPECTED for the tests, got $ACTUAL"
                exit 1
              }
              ;;
            *) echo "node $ACTUAL (from $EXPECTED)" ;;
          esac

      # The GitHub Action ships a committed dist bundle (see .gitignore negation).
      # The Build above rebuilds it; fail if the committed copy is stale so the
      # bundled core can never drift from source. Deterministic because pnpm is
      # pinned via the packageManager field.
      #
      # Primary leg only: the bundle's content cannot depend on the runner, and on
      # a Windows checkout the rebuilt file differs from the committed one by line
      # endings alone, which would report drift that is not there.
      - name: Verify GitHub Action bundle is up to date
        if: matrix.primary
        run: |
          if ! git diff --exit-code -- packages/github-action-sfn-diagram/dist; then
            echo "::error::Committed GitHub Action bundle is stale. Run 'pnpm --filter github-action-sfn-diagram build' and commit packages/github-action-sfn-diagram/dist."
            exit 1
          fi


      # Budgets are bytes, so they cannot differ by runner - and this needs the
      # Build above, which is why it sits here rather than beside the test steps.
      # It prints every entry's headroom, not just failures, so a PR that grows a
      # bundle on purpose can see by how much before raising a number.
      - name: Bundle size
        if: matrix.primary
        run: pnpm run check:bundle-size

      # Root eslint config lints core and all packages (playground is ignored).
      # Neither eslint's nor tsc's verdict can differ by platform or Node version,
      # so both stay on the primary leg.
      - name: Lint
        if: matrix.primary
        run: pnpm run lint

      - name: Typecheck
        if: matrix.primary
        run: pnpm turbo run typecheck

      # publint + attw catch export-map and type-resolution regressions across the
      # dual ESM/CJS subpaths. These also run at publish time (release-please.yml),
      # but by then the release tag is already cut and a failure leaves a tagged
      # release with nothing on npm — catching it on the PR is the cheap path.
      # Only the two npm-published packages; vscode and github-action are not.
      - name: Validate package exports
        if: matrix.primary
        run: |
          pnpm run validate
          pnpm --filter sfn-diagram-react run validate

      # Install the packed tarball into an empty project and run the bin the way a
      # package manager links it: a symlink under node_modules/.bin on Linux and
      # macOS, a shim on Windows. The CLI's entry guard compared the raw symlink
      # path to import.meta.url and silently did nothing from v0.5.1 to v1.6.0 -
      # nothing in the suite spawned the bin, and Windows shims hid it locally.
      #
      # Runs on every leg, not just the primary one. The `binary-smoke` jobs below
      # cover the *bun-compiled* binary on Linux and Windows and skip macOS
      # entirely (codesign), so without this the npm-installed entry point is
      # never spawned on macOS at all, and on Windows only in its compiled form.
      # The node-20 leg is the point of the exercise: it runs the bin under the
      # version engines.node claims to support.
      - name: Smoke test the packed tarball's bin
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          WORK="$(mktemp -d)"
          TARBALL="$WORK/$(npm pack --silent --pack-destination "$WORK")"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL" >/dev/null
          ACTUAL="$(./node_modules/.bin/sfn-diagram --version)"
          [ "$ACTUAL" = "$VERSION" ] || {
            echo "::error::packed bin printed '$ACTUAL', expected '$VERSION'"
            exit 1
          }
          ./node_modules/.bin/sfn-diagram - --format svg \
            < "$GITHUB_WORKSPACE/tests/fixtures/simple.asl.json" | grep -q '<svg' || {
            echo "::error::packed bin did not render an SVG from stdin"
            exit 1
          }

      # Two commands rather than one `pnpm turbo run test`: in a single invocation
      # turbo schedules sfn-diagram#build - pulled in by the other workspaces'
      # `dependsOn: ["^build"]` - concurrently with sfn-diagram#test, whose very
      # first step is `build-viewer-script.mjs --check` reading the two generated
      # files that build rewrites. A torn read there reports a stale bundle that is
      # not stale. Splitting the two removes the overlap.
      - name: Test
        if: matrix.node != '20'
        run: |
          pnpm test
          pnpm turbo run test --filter='!sfn-diagram'

      # Two things in the workspace fan-out run tsdown, so neither works on Node 20
      # (see the build note above): packages/sfn-diagram-react's `test` script
      # rebuilds first, and the `element` project shells out to
      # scripts/build-test-element-bundle.mjs to bundle a page for Puppeteer. Both
      # are deliberately skipped on this leg and covered by the four others; the
      # unit and perf projects contain no bundler and run here against the dist
      # built under 22, as does the packed CLI in the step above.
      - name: Test (unit + perf; element and the fan-out need a Node-22 bundler)
        if: matrix.node == '20'
        run: |
          node scripts/build-viewer-script.mjs --check
          pnpm exec vitest run --project unit
          pnpm exec vitest run --project perf

      # Coverage is the unit project only, so its number cannot differ by platform
      # or Node version. vitest fails the run itself when a threshold in
      # vitest.config.ts is missed; the artifact is for reading the detail after.
      - name: Coverage
        if: matrix.primary
        run: pnpm run test:coverage

      - name: Upload coverage
        if: matrix.primary && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  # The Dockerfile (docker.yml) is otherwise only ever exercised for real at
  # release time - a broken build stage (the missing `scripts/` COPY that broke
  # every image from v1.4.0 through v1.5.0) went unnoticed for three releases
  # because nothing built it until then. Build - never push - on every PR so
  # Dockerfile/build-script drift fails here instead of at release time.
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # buildx rather than plain `docker build`, for the GitHub Actions layer cache:
      # this job runs on every PR, and most PRs change nothing the image depends on.
      # `load: true` keeps the image in the runner's daemon so the smoke test below
      # can run it - which is also why this build stays single-platform.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # scope= per build variant: a type=gha export replaces the whole index for its
      # scope, so builds that share one evict each other instead of sharing. mode=min
      # rather than max because the repo's Actions cache quota is 10 GB and ~14 other
      # jobs keep their pnpm caches in it; exporting every intermediate layer of a
      # three-stage image on every PR would evict them.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=docker-check-amd64
          cache-to: type=gha,mode=min,scope=docker-check-amd64
          context: .
          load: true
          tags: sfn-diagram-ci-check

      # TEMPORARY - removed before this PR merges. docker.yml's multi-platform build
      # only ever runs at release time, and arm64 cannot be emulated on the machine
      # this was written on (WSL has no binfmt_misc), so this proves the arm64 build
      # works at least once, on a real runner, before the change ships.
      - name: (temporary) Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=docker-check-multiarch
          cache-to: type=gha,mode=min,scope=docker-check-multiarch
          context: .
          outputs: type=cacheonly
          platforms: linux/amd64,linux/arm64

      # Same script docker.yml runs against the published image, so the two cannot
      # drift (#230). It takes the font path from scripts/font-probes.mjs rather
      # than restating it.
      - name: Smoke test the built image
        run: bash scripts/docker-smoke.sh --image sfn-diagram-ci-check --png-out docker-smoke/diagram.png

      # The byte checks prove a PNG came out, not that it has anything in it.
      # Keep the render downloadable so a human can eyeball text rendering.
      - name: Upload the Docker PNG smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-png-smoke
          path: docker-smoke/diagram.png
          if-no-files-found: warn

  # The standalone binaries (release-please.yml `binaries` job) bundle dist/bin.js
  # with bun. Anything the CLI graph picks up that bun cannot bundle, or that
  # assumes a package.json next to the script, would otherwise only surface at
  # release time. Build each target on a runner that can execute it natively
  # and run the same smoke test the release job runs against the uploaded
  # assets. macOS is left to the release job: its binaries have to be re-signed
  # with codesign before they will launch, and a macOS runner per PR is not
  # worth that for a check the release job already performs.
  binary-smoke:
    name: Standalone Binary Smoke Test (${{ matrix.binary }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: sfn-diagram-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: sfn-diagram-linux-arm64
          - os: windows-latest
            target: bun-windows-x64
            binary: sfn-diagram-windows-x64.exe
    runs-on: ${{ matrix.os }}
    # Git Bash on the Windows runner; the smoke test script is bash-only.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build core
        run: pnpm run build

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build ${{ matrix.binary }}
        run: pnpm run build:binary --target ${{ matrix.target }}

      - name: Smoke test
        run: bash scripts/smoke-test-binary.sh binaries/${{ matrix.binary }}
