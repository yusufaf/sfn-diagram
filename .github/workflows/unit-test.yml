name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      # PNG export (node-html-to-image) launches puppeteer 23.2.2 with
      # headless: "shell", so it needs the chrome-headless-shell binary in
      # puppeteer's cache (~/.cache/puppeteer) — not just chrome. Install both
      # explicitly rather than relying on puppeteer's postinstall, which pnpm may
      # skip. No PUPPETEER_EXECUTABLE_PATH needed (Turbo strict env would strip it).
      - name: Install browsers for Puppeteer
        run: |
          pnpm exec puppeteer browsers install chrome
          pnpm exec puppeteer browsers install chrome-headless-shell

      # Build every workspace (core + react, vscode, github-action, playground)
      # so package build breakage is caught, not just the core library.
      - name: Build
        run: pnpm turbo run build

      # The GitHub Action ships a committed dist bundle (see .gitignore negation).
      # The Build above rebuilds it; fail if the committed copy is stale so the
      # bundled core can never drift from source. Deterministic because pnpm is
      # pinned via the packageManager field.
      - name: Verify GitHub Action bundle is up to date
        run: |
          if ! git diff --exit-code -- packages/github-action-sfn-diagram/dist; then
            echo "::error::Committed GitHub Action bundle is stale. Run 'pnpm --filter github-action-sfn-diagram build' and commit packages/github-action-sfn-diagram/dist."
            exit 1
          fi

      # Root eslint config lints core and all packages (playground is ignored).
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test
