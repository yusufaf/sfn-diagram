name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      # PNG export (node-html-to-image) launches puppeteer 25.3.0 with
      # headless: "shell", so it needs the chrome-headless-shell binary in
      # puppeteer's cache (~/.cache/puppeteer) — not just chrome. Install both
      # explicitly rather than relying on puppeteer's postinstall, which pnpm may
      # skip. No PUPPETEER_EXECUTABLE_PATH needed (Turbo strict env would strip it).
      - name: Install browsers for Puppeteer
        run: |
          pnpm exec puppeteer browsers install chrome
          pnpm exec puppeteer browsers install chrome-headless-shell

      # Build every workspace (core + react, vscode, github-action, playground)
      # so package build breakage is caught, not just the core library.
      - name: Build
        run: pnpm turbo run build

      # The GitHub Action ships a committed dist bundle (see .gitignore negation).
      # The Build above rebuilds it; fail if the committed copy is stale so the
      # bundled core can never drift from source. Deterministic because pnpm is
      # pinned via the packageManager field.
      - name: Verify GitHub Action bundle is up to date
        run: |
          if ! git diff --exit-code -- packages/github-action-sfn-diagram/dist; then
            echo "::error::Committed GitHub Action bundle is stale. Run 'pnpm --filter github-action-sfn-diagram build' and commit packages/github-action-sfn-diagram/dist."
            exit 1
          fi

      # Root eslint config lints core and all packages (playground is ignored).
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      # publint + attw catch export-map and type-resolution regressions across the
      # dual ESM/CJS subpaths. These also run at publish time (release-please.yml),
      # but by then the release tag is already cut and a failure leaves a tagged
      # release with nothing on npm — catching it on the PR is the cheap path.
      # Only the two npm-published packages; vscode and github-action are not.
      - name: Validate package exports
        run: |
          pnpm run validate
          pnpm --filter sfn-diagram-react run validate

      # Install the packed tarball into an empty project and run the bin the
      # way npm links it on Linux: as a symlink under node_modules/.bin. The
      # CLI's entry guard compared the raw symlink path to import.meta.url and
      # silently did nothing on that path from v0.5.1 to v1.6.0 - nothing in the
      # suite spawned the bin, and Windows shims hid it locally.
      - name: Smoke test the packed tarball's bin
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          WORK="$(mktemp -d)"
          TARBALL="$WORK/$(npm pack --silent --pack-destination "$WORK")"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$TARBALL" >/dev/null
          ACTUAL="$(./node_modules/.bin/sfn-diagram --version)"
          [ "$ACTUAL" = "$VERSION" ] || {
            echo "::error::packed bin printed '$ACTUAL', expected '$VERSION'"
            exit 1
          }
          ./node_modules/.bin/sfn-diagram - --format svg \
            < "$GITHUB_WORKSPACE/tests/fixtures/simple.asl.json" | grep -q '<svg' || {
            echo "::error::packed bin did not render an SVG from stdin"
            exit 1
          }

      - name: Test
        run: pnpm turbo run test

  # The Dockerfile (docker.yml) is otherwise only ever exercised for real at
  # release time - a broken build stage (the missing `scripts/` COPY that broke
  # every image from v1.4.0 through v1.5.0) went unnoticed for three releases
  # because nothing built it until then. Build - never push - on every PR so
  # Dockerfile/build-script drift fails here instead of at release time.
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t sfn-diagram-ci-check .

      - name: Smoke test the built image
        run: |
          docker run --rm sfn-diagram-ci-check --version
          docker run --rm -i sfn-diagram-ci-check - --format svg \
            < tests/fixtures/simple.asl.json | grep -q '<svg' || {
            echo "::error::Docker image did not render a valid SVG from stdin"
            exit 1
          }

  # The standalone binaries (release-please.yml `binaries` job) bundle dist/cli.js
  # with bun. Anything the CLI graph picks up that bun cannot bundle, or that
  # assumes a package.json next to the script, would otherwise only surface at
  # release time. Build one target here and run the same smoke test the release
  # job runs against the uploaded assets.
  binary-smoke:
    name: Standalone Binary Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set node LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build core
        run: pnpm run build

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build linux-x64 binary
        run: pnpm run build:binary --target bun-linux-x64

      - name: Smoke test
        run: bash scripts/smoke-test-binary.sh binaries/sfn-diagram-linux-x64
